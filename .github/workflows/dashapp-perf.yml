name: Dash-app performance

on:
  push:
    branches: [main]
    paths:
      - "dash-apps/web-*/**"
      - "dash-apps/_perf-harness/**"
      - "dashpilot-android/**/CarStateBridge.kt"
  pull_request:
    paths:
      - "dash-apps/web-*/**"
      - "dash-apps/_perf-harness/**"
      - "dashpilot-android/**/CarStateBridge.kt"

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            dash-apps/_perf-harness/package-lock.json
            dash-apps/web-expo/package-lock.json

      - name: Install harness
        working-directory: dash-apps/_perf-harness
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dash-apps/_perf-harness/package-lock.json') }}

      - name: Install Chromium
        working-directory: dash-apps/_perf-harness
        run: npx playwright install --with-deps chromium

      - name: Harness self-test
        working-directory: dash-apps/_perf-harness
        run: npm test

      - name: Benchmark dash-apps
        working-directory: dash-apps/_perf-harness
        shell: bash
        run: |
          set -euo pipefail

          # The self-test wrote fixture reports into results/ — start clean
          rm -rf results

          # Determine git diff range — PR vs push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.event.after }}"
          else
            range=""  # no usable base — re-check everything
          fi

          if [ -n "$range" ]; then
            changed_files=$(git -C ../.. diff --name-only "$range")
          else
            changed_files="dash-apps/_perf-harness/"
          fi

          # Apps whose source files changed → blocking (fail the build)
          changed_apps=$(echo "$changed_files" | sed -n 's#^dash-apps/\(web-[^/]*\)/.*#\1#p' | sort -u)

          # Harness/budget change → re-check all gated apps
          harness_changed=$(echo "$changed_files" | grep -q '^dash-apps/_perf-harness/' && echo true || echo false)
          if [ "$harness_changed" = "true" ]; then
            apps_to_run=$(ls -d ../web-*/ 2>/dev/null | xargs -n1 basename | sort)
          else
            apps_to_run="$changed_apps"
          fi

          if [ -z "$apps_to_run" ]; then
            echo "No gated dash-apps to benchmark."
            echo "No gated dash-apps to benchmark." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          failed=0
          for app in $apps_to_run; do
            # Deleted/renamed in this diff — nothing to benchmark
            [ -d "../$app" ] || continue

            perf=$(jq -r '[(.perf.gate // "standard"), (.perf.root // ".")] | @tsv' "../$app/manifest.json" 2>/dev/null || printf 'standard\t.')
            IFS=$'\t' read -r gate root <<<"$perf"

            if [ "$gate" = "exempt" ]; then
              reason=$(jq -r '.perf.reason // ""' "../$app/manifest.json" 2>/dev/null || echo "")
              if [ "${#reason}" -lt 10 ]; then
                echo "::error::$app: perf.gate \"exempt\" requires a perf.reason explaining why"
                echo "- \`$app\` FAILED: gate \"exempt\" requires a perf.reason explaining why" >> "$GITHUB_STEP_SUMMARY"
                failed=1
              else
                echo "- \`$app\` skipped (exempt): $reason" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi

            # Build web-expo from source before benchmarking
            if [ "$app" = "web-expo" ]; then
              (cd ../web-expo && npm ci && npx expo export --platform web)
            fi

            echo "::group::$app"
            node run.js "../$app/$root" --app-name "$app" || failed=1
            echo '::endgroup::'
          done

          exit $failed

      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: dash-apps/_perf-harness/results/
          if-no-files-found: ignore
