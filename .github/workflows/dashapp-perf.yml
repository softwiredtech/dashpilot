name: Dash-app performance

on:
  push:
    branches: [main]
    paths:
      - "dash-apps/web-*/**"
      - "dash-apps/_perf-harness/**"
      - "dashpilot-android/**/CarStateBridge.kt"
  pull_request:
    paths:
      - "dash-apps/web-*/**"
      - "dash-apps/_perf-harness/**"
      - "dashpilot-android/**/CarStateBridge.kt"

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            dash-apps/_perf-harness/package-lock.json
            dash-apps/web-expo/package-lock.json

      - name: Install harness
        working-directory: dash-apps/_perf-harness
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dash-apps/_perf-harness/package-lock.json') }}

      - name: Install Chromium
        working-directory: dash-apps/_perf-harness
        run: npx playwright install --with-deps chromium

      - name: Harness self-test
        working-directory: dash-apps/_perf-harness
        run: npm test

      - name: Determine target apps
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # Force the harness-changed path so a no-base event still rechecks every gated app.
            targets_json="$(printf 'dash-apps/_perf-harness/package.json\n' | node dash-apps/_perf-harness/lib/targets.js)"
          else
            targets_json="$(git diff --name-only "$base"...HEAD | node dash-apps/_perf-harness/lib/targets.js)"
          fi

          echo "$targets_json"

          {
            echo 'targets<<EOF'
            echo "$targets_json"
            echo 'EOF'
            echo "export_web_expo=$(echo "$targets_json" | jq -r '.gated | any(.name == "web-expo")')"
          } >> "$GITHUB_OUTPUT"

      - name: Export web-expo for benchmarking
        if: steps.targets.outputs.export_web_expo == 'true'
        working-directory: dash-apps/web-expo
        run: |
          npm ci
          npx expo export --platform web

      - name: Benchmark gated dash-apps
        working-directory: dash-apps/_perf-harness
        env:
          TARGETS_JSON: ${{ steps.targets.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail

          skipped="$(echo "$TARGETS_JSON" | jq -r '.skipped[] | "- `\(.name)` skipped: \(.reason)"')"
          if [ -n "$skipped" ]; then
            printf '### dash-app perf: exempt apps\n%s\n\n' "$skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          gated="$(echo "$TARGETS_JSON" | jq -r '.gated[] | "\(.name)\t\(.root)"')"
          if [ -z "$gated" ]; then
            echo "No gated dash-apps to benchmark."
            echo "No gated dash-apps to benchmark." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          failed=0
          while IFS=$'\t' read -r name root; do
            [ -n "$name" ] || continue
            echo "::group::$name"
            node run.js "../$name/$root" --app-name "$name" || failed=1
            echo '::endgroup::'
          done <<< "$gated"

          exit $failed

      - name: Upload full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: dash-apps/_perf-harness/results/
          if-no-files-found: ignore
