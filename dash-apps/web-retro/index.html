<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DashPilot</title>
<style>

@font-face {
  font-family: "Geist Mono";
  font-style: normal;
  font-weight: 200;
  font-display: swap;
  src: url("fonts/geist-mono-200.woff2") format("woff2");
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --safe-top: 0px;
  --safe-right: 0px;
  --safe-bottom: 0px;
  --safe-left: 0px;
  --rgb-page-bg: 5 6 10;
  --color-page-bg: rgb(var(--rgb-page-bg));
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--color-page-bg);
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: "Geist Mono", 'Courier New', Courier, monospace;
}

.viewport {
  position: fixed;
  inset: 0;
  padding-top: max(env(safe-area-inset-top), var(--safe-top));
  padding-right: max(env(safe-area-inset-right), var(--safe-right));
  padding-bottom: max(env(safe-area-inset-bottom), var(--safe-bottom));
  padding-left: max(env(safe-area-inset-left), var(--safe-left));
}

.stage {
  width: 100%;
  height: 100%;
  container-type: size;
  --layout-width: 580;
  --layout-height: 216;
  --u: min(calc(100vw / var(--layout-width)), calc(100vh / var(--layout-height)));
}

@supports (width: 1cqw) {
  .stage {
    --u: min(calc(100cqw / var(--layout-width)), calc(100cqh / var(--layout-height)));
  }
}

/* ── BEZEL ───────────────────────────────── */
.bezel {
  width: 100%;
  height: 100%;
}

/* ── FACE ────────────────────────────────── */
.face {
  --rgb-cluster: 92 232 69;
  --rgb-cluster-bright: 184 255 142;
  --rgb-mads: 96 208 255;
  --rgb-warn: 255 100 24;
  --rgb-urgent: 255 34 0;
  --rgb-bg: 3 6 4;
  --rgb-face-top: 8 16 10;
  --rgb-black: 0 0 0;
  --rgb-white: 255 255 255;
  --display-digits: 3;
  --d14-gap-md: calc(4 * var(--u));
  --d14-gap-lg: calc(5 * var(--u));
  --d14-gap-xxl: calc(10 * var(--u));
  --d14-width-md: calc(26 * var(--u));
  --d14-width-lg: calc(42 * var(--u));
  --d14-width-xxl: calc(66 * var(--u));
  --d14-height-md: calc(44 * var(--u));
  --d14-height-lg: calc(60 * var(--u));
  --d14-height-xxl: calc(108 * var(--u));
  --bs-blink-duration: 0.75s;
  --bs-blink-loop-delay: 280ms;
  --bs-blink-step-delay: 70ms;
  --bs-urgent-duration: 0.46s;
  --bg: rgb(var(--rgb-bg));
  --color-face-top: rgb(var(--rgb-face-top) / 0.98);
  --color-cluster: rgb(var(--rgb-cluster));
  --color-cluster-bright: rgb(var(--rgb-cluster-bright));
  --color-cluster-ghost: rgb(var(--rgb-cluster) / 0.12);
  --color-cluster-radial: rgb(var(--rgb-cluster) / 0.05);
  --color-cluster-frame: rgb(var(--rgb-cluster) / 0.06);
  --color-cluster-divider: rgb(var(--rgb-cluster) / 0.08);
  --color-mads: rgb(var(--rgb-mads));
  --color-mads-ghost: rgb(var(--rgb-mads) / 0.14);
  --color-warn: rgb(var(--rgb-warn));
  --color-urgent: rgb(var(--rgb-urgent));
  --color-sheen-strong: rgb(var(--rgb-white) / 0.045);
  --color-sheen-soft: rgb(var(--rgb-white) / 0.018);
  --color-scanline-strong: rgb(var(--rgb-white) / 0.04);
  --color-scanline-soft: rgb(var(--rgb-white) / 0.025);
  --color-gridline-soft: rgb(var(--rgb-white) / 0.012);
  --color-gridline-faint: rgb(var(--rgb-white) / 0.008);
  --color-vignette-mid: rgb(var(--rgb-black) / 0.18);
  --color-vignette-strong: rgb(var(--rgb-black) / 0.42);
  --glow-core-color: rgb(var(--rgb-bg) / 0.9);
  --shadow-cluster-glow: 0 0 1px var(--glow-core-color), 0 0 7px rgb(var(--rgb-cluster) / 0.35);
  --shadow-mads-glow: 0 0 1px var(--glow-core-color), 0 0 7px rgb(var(--rgb-mads) / 0.35);
  --shadow-warn-glow: 0 0 1px var(--glow-core-color), 0 0 7px rgb(var(--rgb-warn) / 0.35);
  --shadow-urgent-glow: 0 0 1px var(--glow-core-color), 0 0 7px rgb(var(--rgb-urgent) / 0.38);
  --shadow-mads-strong: 0 0 1px var(--glow-core-color), 0 0 9px rgb(var(--rgb-mads) / 0.35), 0 0 16px rgb(var(--rgb-mads) / 0.20);
  --filter-cluster-glow: drop-shadow(0 0 1px var(--glow-core-color)) drop-shadow(0 0 7px rgb(var(--rgb-cluster) / 0.35));
  --filter-mads-glow: drop-shadow(0 0 1px var(--glow-core-color)) drop-shadow(0 0 7px rgb(var(--rgb-mads) / 0.35));
  --filter-warn-glow: drop-shadow(0 0 1px var(--glow-core-color)) drop-shadow(0 0 7px rgb(var(--rgb-warn) / 0.35));

  background:
    radial-gradient(circle at 50% 42%, var(--color-cluster-radial), transparent 54%),
    linear-gradient(180deg, var(--color-face-top), var(--bg) 66%);
  border-radius: 0;
  box-shadow: inset 0 0 0 1px var(--color-cluster-frame);
  overflow: hidden;
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  height: 100%;
  justify-content: space-between;
}

.face::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background:
    radial-gradient(140% 110% at 50% 42%, transparent 54%, var(--color-vignette-mid) 76%, var(--color-vignette-strong) 100%),
    linear-gradient(180deg, var(--color-sheen-strong), transparent 18%, transparent 82%, var(--color-sheen-soft));
}

.face::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.18;
  background-image:
    linear-gradient(var(--color-scanline-soft), var(--color-gridline-faint)),
    repeating-linear-gradient(0deg, var(--color-scanline-strong) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, var(--color-gridline-soft) 0 1px, transparent 1px 6px);
}


/* ═══════════════════════════════════════════
   ZONE 1 — BLIND SPOT / BLINKER TAPE
   ═══════════════════════════════════════════ */

.bs-tape {
  flex: 1;
  display: flex;
  align-items: stretch;
  padding: calc(11 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u));
}

.bs-side { display: flex; gap: calc(3 * var(--u)); flex: 1; }
.bs-left  { flex-direction: row-reverse; }
.bs-right { flex-direction: row; }

.bs-cell {
  flex: 1;
  height: 100%;
  min-height: calc(18 * var(--u));
  max-height: calc(22 * var(--u));
  margin-block: auto;
  background: var(--color-cluster-ghost);
  border-radius: calc(1 * var(--u));
}

.bs-side.is-blink .bs-cell:nth-child(n + 5) {
  animation-name: bs-blink-prime, bs-blink;
  animation-duration: 1ms, var(--bs-blink-duration);
  animation-timing-function: step-end, step-end;
  animation-iteration-count: 1, infinite;
  animation-fill-mode: forwards, none;
}

.bs-side.is-blink .bs-cell:nth-child(5) { animation-delay: calc(3 * var(--bs-blink-step-delay)), var(--bs-blink-loop-delay); }
.bs-side.is-blink .bs-cell:nth-child(6) { animation-delay: calc(2 * var(--bs-blink-step-delay)), var(--bs-blink-loop-delay); }
.bs-side.is-blink .bs-cell:nth-child(7) { animation-delay: calc(1 * var(--bs-blink-step-delay)), var(--bs-blink-loop-delay); }
.bs-side.is-blink .bs-cell:nth-child(8) { animation-delay: 0ms, var(--bs-blink-loop-delay); }

.bs-side.is-hazard .bs-cell {
  animation: bs-hazard var(--bs-blink-duration) step-end infinite;
}

@keyframes bs-blink-prime {
  to {
    background: var(--color-cluster);
    box-shadow: var(--shadow-cluster-glow);
  }
}
@keyframes bs-blink {
  0%,49% {
    background: var(--color-cluster);
    box-shadow: var(--shadow-cluster-glow);
  }
  50%,100% {
    background: var(--color-cluster-ghost);
    box-shadow: none;
  }
}
@keyframes bs-hazard {
  0%,49% {
    background: var(--color-urgent);
    box-shadow: var(--shadow-urgent-glow);
  }
  50%,100% {
    background: var(--color-cluster-ghost);
    box-shadow: none;
  }
}

.bs-side.is-blind .bs-cell:nth-child(n + 5) {
  background: var(--color-warn);
  box-shadow: var(--shadow-warn-glow);
}

.bs-side.is-urgent .bs-cell:nth-child(n + 5) {
  background: var(--color-urgent);
  animation: bs-urgent var(--bs-urgent-duration) ease-in-out infinite;
  box-shadow: var(--shadow-urgent-glow);
}
@keyframes bs-urgent {
  0%,100% { opacity:0.4; background:var(--color-warn); }
  50%     { opacity:1;   background:var(--color-urgent); }
}

.tape-divider {
  width: calc(14 * var(--u)); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.tape-divider-line {
  width: 1px; height: 100%;
  background: var(--color-cluster-divider);
}


/* ═══════════════════════════════════════════
   ZONE 2 — MAIN DATA ROW
   ═══════════════════════════════════════════ */

.data-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: 'gear speed right';
  align-items: center;
  padding: calc(24 * var(--u)) calc(24 * var(--u));
}

/* LEFT: gear */
.left-zone {
  grid-area: gear;
  display: flex;
  align-items: flex-start;
}

/* CENTER: speed */
.speed-zone {
  grid-area: speed;
  display: flex; flex-direction: row;
  align-items: flex-end; gap: calc(12 * var(--u));
  transform: translateX(calc(-19 * var(--u)));
}

.speed-aside {
  display: flex; flex-direction: column;
  align-items: flex-start; justify-content: flex-end;
  height: calc(108 * var(--u));
}

.unit-label {
  font-size: calc(11 * var(--u)); font-weight: 700;
  letter-spacing: 0.25em;
  color: rgb(var(--rgb-cluster) / 0.16);
}
.unit-label.active {
  color: rgb(var(--rgb-mads) / 0.42);
  text-shadow: var(--shadow-mads-glow);
}

/* RIGHT: set + limit */
.right-zone {
  grid-area: right;
  display: flex; flex-direction: column;
  align-items: flex-end; gap: calc(9 * var(--u));
}

body.portrait-layout .stage {
  --layout-width: 360;
  --layout-height: 640;
}

body.portrait-layout .data-row {
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas:
    '. speed .'
    'gear . right';
  row-gap: calc(14 * var(--u));
  padding: calc(16 * var(--u)) calc(18 * var(--u)) calc(15 * var(--u));
}

body.portrait-layout .speed-zone {
  justify-self: center;
  transform: none;
}

body.portrait-layout .left-zone {
  align-self: end;
}

body.portrait-layout .right-zone {
  justify-self: end;
  gap: calc(7 * var(--u));
}

.sec-row { display: flex; align-items: center; gap: calc(9 * var(--u)); }


.icon-lim {
  width: calc(15 * var(--u)); height: calc(15 * var(--u)); border-radius: 50%;
  color: rgb(var(--rgb-urgent) / 0.18);
  border: calc(2.5 * var(--u)) solid currentColor;
  flex-shrink: 0; position: relative;
  transition: color 0.3s, opacity 0.3s, box-shadow 0.3s;
}
.icon-lim::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(10.25 * var(--u));
  height: calc(2.5 * var(--u));
  background: currentColor;
  transform: translate(calc(-50% + (0.09 * var(--u))), calc(-50% - (0.09 * var(--u)))) rotate(-45deg);
}
.icon-lim.active {
  color: var(--color-urgent);
  box-shadow: var(--shadow-urgent-glow);
}

.icon-lim.hidden {
  opacity: 0;
}



/* ═══════════════════════════════════════════
   ZONE 3 — MODE STRIP
   ═══════════════════════════════════════════ */

.mode-strip {
  flex: 1;
  display: flex;
  align-items: stretch;
  padding-top: calc(10 * var(--u));
  padding-right: calc(14 * var(--u));
  padding-bottom: calc(10 * var(--u));
  padding-left: calc(14 * var(--u));
  justify-content: center;
}

.mode-strip-inner {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
}

.mode-text {
  min-width: calc(48 * var(--u));
  font-size: calc(17 * var(--u));
  font-weight: 700;
  letter-spacing: 0.22em;
  text-align: center;
  transition: color 0.2s, text-shadow 0.2s;
}

#mode-mads {
  color: rgb(var(--rgb-mads) / 0.18);
}

#mode-full {
  color: rgb(var(--rgb-cluster) / 0.18);
}

#mode-mads.active.mads {
  color: var(--color-mads);
  text-shadow: var(--shadow-mads-strong);
}

#mode-full.active.full {
  color: var(--color-cluster-bright);
  text-shadow: var(--shadow-cluster-glow);
}


.disp     { display:flex; align-items:center; gap:var(--d14-gap-md); }
.disp.lg  { gap:var(--d14-gap-lg); }
.disp.xxl { gap:var(--d14-gap-xxl); }

#speed-disp { width: calc((var(--display-digits) * var(--d14-width-xxl)) + ((var(--display-digits) - 1) * var(--d14-gap-xxl))); } /* gap between digits 2&3 at zone center via .speed-zone transform */
#set-disp { width: calc((var(--display-digits) * var(--d14-width-md)) + ((var(--display-digits) - 1) * var(--d14-gap-md))); }
#lim-disp { width: calc((var(--display-digits) * var(--d14-width-md)) + ((var(--display-digits) - 1) * var(--d14-gap-md))); }


/* ── 14-SEGMENT DIGITS ──────────────── */
.d14 { position: relative; display: inline-block; flex-shrink: 0; }
.d14.md  { width: var(--d14-width-md); height: var(--d14-height-md); }
.d14.lg  { width: var(--d14-width-lg); height: var(--d14-height-lg); }
.d14.xxl { width: var(--d14-width-xxl); height: var(--d14-height-xxl); }
.d14-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  transform: skewX(-5deg);
  transform-origin: center;
}
.d14-base { fill: var(--color-cluster-ghost); }
.d14-base.mads-c { fill: var(--color-mads-ghost); }
.d14-base.limit-c { fill: rgb(var(--rgb-warn) / 0.14); }
.d14-on { fill: transparent; }
.d14-on.on {
  fill: var(--color-cluster-bright);
  filter: var(--filter-cluster-glow);
}
.d14-on.on.mads-c {
  fill: var(--color-mads);
  filter: var(--filter-mads-glow);
}
.d14-on.on.limit-c {
  fill: var(--color-warn);
  filter: var(--filter-warn-glow);
}

</style>
</head>

    <path id="d14-glyph-d" d="M 12.5,9 L 15.5,12 L 29.5,12 L 32.5,9 Z M 33,9.5 L 30,12.5 L 30,23.5 L 33,26.5 Z M 33,26.5 L 30,29.5 L 30,40.5 L 33,43.5 Z M 12.5,44 L 15.5,41 L 29.5,41 L 32.5,44 Z M 22.5,25 L 21,23.5 L 21,13 L 24,13 L 24,23.5 L 22.5,25 Z M 22.5,28 L 21,29.5 L 21,40 L 24,40 L 24,29.5 L 22.5,28 Z"></path>
    <path id="d14-glyph-p" d="M 12.5,9 L 15.5,12 L 29.5,12 L 32.5,9 Z M 33,9.5 L 30,12.5 L 30,23.5 L 33,26.5 Z M 12,26.5 L 15,29.5 L 15,40.5 L 12,43.5 Z M 12,9.5 L 15,12.5 L 15,23.5 L 12,26.5 Z M 14.5,25 L 13,26.5 L 14.5,28 L 20.5,28 L 22,26.5 L 20.5,25 Z M 24.5,25 L 23,26.5 L 24.5,28 L 30.5,28 L 32,26.5 L 30.5,25 Z"></path>
    <path id="d14-glyph-r" d="M 12.5,9 L 15.5,12 L 29.5,12 L 32.5,9 Z M 33,9.5 L 30,12.5 L 30,23.5 L 33,26.5 Z M 12,26.5 L 15,29.5 L 15,40.5 L 12,43.5 Z M 12,9.5 L 15,12.5 L 15,23.5 L 12,26.5 Z M 14.5,25 L 13,26.5 L 14.5,28 L 20.5,28 L 22,26.5 L 20.5,25 Z M 24.5,25 L 23,26.5 L 24.5,28 L 30.5,28 L 32,26.5 L 30.5,25 Z M 29,35 L 25,29 L 25,34 L 29,40 Z"></path>
    <path id="d14-glyph-n" d="M 33,9.5 L 30,12.5 L 30,23.5 L 33,26.5 Z M 33,26.5 L 30,29.5 L 30,40.5 L 33,43.5 Z M 12,26.5 L 15,29.5 L 15,40.5 L 12,43.5 Z M 12,9.5 L 15,12.5 L 15,23.5 L 12,26.5 Z M 16,18 L 20,24 L 20,19 L 16,13 Z M 29,35 L 25,29 L 25,34 L 29,40 Z"></path>

  </defs>
</svg>

<div class="viewport" id="viewport">
<div class="stage" id="stage">
<div class="bezel" id="cluster">
<div class="face">

  <!-- ZONE 1: BLIND SPOT / BLINKER -->
  <div class="bs-tape">
    <div class="bs-side bs-left" id="bs-left">
      <div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div>
    </div>
    <div class="tape-divider"><div class="tape-divider-line"></div></div>
    <div class="bs-side bs-right" id="bs-right">
      <div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div><div class="bs-cell"></div>
    </div>
  </div>

  <!-- ZONE 2: DATA -->
  <div class="data-row">

    <div class="left-zone">
      <div class="disp lg" id="gear-disp"></div>
    </div>

    <div class="speed-zone">
      <div class="disp xxl" id="speed-disp"></div>
      <div class="speed-aside">
        <span class="unit-label active" id="unit-label">MPH</span>
      </div>
    </div>

    <div class="right-zone">
      <div class="sec-row">
        <div class="disp md" id="set-disp"></div>
      </div>

      <div class="sec-row">
        <div class="icon-lim" id="icon-lim"></div>
        <div class="disp md" id="lim-disp"></div>
      </div>
    </div>

  </div>

  <!-- ZONE 3: MODE -->
  <div class="mode-strip">
    <div class="mode-strip-inner">
      <span class="mode-text" id="mode-mads">MADS</span>
    <div class="tape-divider"><div class="tape-divider-line"></div></div>
      <span class="mode-text" id="mode-full">FULL</span>
    </div>
  </div>

</div>
</div>
</div>
</div>


<script>
const GEAR_MAP = { 1:'P', 2:'R', 3:'N', 4:'D' };
const DISPLAY_DIGITS = 3;
const BLANK_DISPLAY = ' '.repeat(DISPLAY_DIGITS);
const MAX_DISPLAY_VALUE = 999;
const GEAR_FALLBACK = 'D';
const OVERSPEED_THRESHOLD = 0.15;
const PORTRAIT_BREAKPOINT = 560;
const SVG_NS = 'http://www.w3.org/2000/svg';
const XLINK_NS = 'http://www.w3.org/1999/xlink';
const SEG14_BASE_ID = 'd14-glyph-base';
const SEG14_BLANK = ' ';
const SEG14_GLYPH_IDS = {
  '0': 'd14-glyph-0',
  '1': 'd14-glyph-1',
  '2': 'd14-glyph-2',
  '3': 'd14-glyph-3',
  '4': 'd14-glyph-4',
  '5': 'd14-glyph-5',
  '6': 'd14-glyph-6',
  '7': 'd14-glyph-7',
  '8': 'd14-glyph-8',
  '9': 'd14-glyph-9',
  'D': 'd14-glyph-d',
  'P': 'd14-glyph-p',
  'R': 'd14-glyph-r',
  'N': 'd14-glyph-n',
  ' ': 'd14-glyph-blank',
};

const UI = {
  speedDisp: document.getElementById('speed-disp'),
  gearDisp: document.getElementById('gear-disp'),
  setDisp: document.getElementById('set-disp'),
  limDisp: document.getElementById('lim-disp'),
  unitLabel: document.getElementById('unit-label'),
  iconLim: document.getElementById('icon-lim'),
  modeMads: document.getElementById('mode-mads'),
  modeFull: document.getElementById('mode-full'),
  stage: document.getElementById('stage'),
  bs: {},
};

let pendingCarState = null;
let renderFrame = 0;
let fitFrame = 0;

function setClassName(el, className) {
  if (el && el.className !== className) el.className = className;
}

function setText(el, text) {
  if (el && el.textContent !== text) el.textContent = text;
}

function setUseHref(el, id) {
  const href = '#' + id;
  if (el.getAttribute('href') !== href) el.setAttribute('href', href);
  if (el.getAttributeNS(XLINK_NS, 'href') !== href) el.setAttributeNS(XLINK_NS, 'xlink:href', href);
}

function updateDigit14(el, ch, colorClass) {
  const nextColorClass = colorClass || '';
  if (el._lastChar === ch && el._lastColorClass === nextColorClass) return;

  const nextChar = SEG14_GLYPH_IDS[ch] ? ch : SEG14_BLANK;
  const glyphId = SEG14_GLYPH_IDS[nextChar];
  const baseClass = 'd14-base' + (nextColorClass ? ' ' + nextColorClass : '');
  const nextClass = 'd14-on' + (nextChar !== SEG14_BLANK ? ' on' + (nextColorClass ? ' ' + nextColorClass : '') : '');
  if (el._baseUse.getAttribute('class') !== baseClass) el._baseUse.setAttribute('class', baseClass);
  setUseHref(el._onUse, glyphId);
  if (el._onUse.getAttribute('class') !== nextClass) el._onUse.setAttribute('class', nextClass);

  el._lastChar = nextChar;
  el._lastColorClass = nextColorClass;
}

function makeDigit14(size) {
  const d = document.createElement('div');
  const svg = document.createElementNS(SVG_NS, 'svg');
  const baseUse = document.createElementNS(SVG_NS, 'use');
  const onUse = document.createElementNS(SVG_NS, 'use');

  d.className = 'd14 ' + size;
  svg.setAttribute('class', 'd14-svg');
  svg.setAttribute('viewBox', '12 9 21 35');
  svg.setAttribute('aria-hidden', 'true');

  setUseHref(baseUse, SEG14_BASE_ID);
  baseUse.setAttribute('class', 'd14-base');
  onUse.setAttribute('class', 'd14-on');

  svg.appendChild(baseUse);
  svg.appendChild(onUse);

  d._baseUse = baseUse;
  d._onUse = onUse;
  d._lastChar = null;
  d._lastColorClass = null;
  d.appendChild(svg);
  return d;
}

function fillDisp14(el, text, size, colorClass) {
  if (!el) return;

  const chars = [...text];
  if (el.childElementCount !== chars.length || el.dataset.size !== size) {
    el.textContent = '';
    chars.forEach(() => el.appendChild(makeDigit14(size)));
    el.dataset.size = size;
  }

  chars.forEach((ch, i) => updateDigit14(el.children[i], ch, colorClass));
}

function formatDisplayValue(value) {
  return String(Math.min(value, MAX_DISPLAY_VALUE)).padStart(DISPLAY_DIGITS, ' ');
}

function initBsTape(id) {
  const el = document.getElementById(id);
  if (!el) return;

  UI.bs[id] = { el, baseClass: el.className, state: null };
}

function bsTapeState(blind, blinker) {
  if (blind && blinker) return 'urgent';
  if (blind)           return 'blind';
  if (blinker)         return 'blink';
  return '';
}

function buildBsTape(state, id) {
  const tape = UI.bs[id];
  if (!tape || tape.state === state) return;

  const nextClass = tape.baseClass + (state ? ' is-' + state : '');
  if (tape.el.className !== nextClass) tape.el.className = nextClass;
  tape.state = state;
}

function setModeState(mode) {
  setClassName(UI.modeMads, 'mode-text' + (mode === 'mads' ? ' active mads' : ''));
  setClassName(UI.modeFull, 'mode-text' + (mode === 'full' ? ' active full' : ''));
}

/* ── Main update ── */
function renderCarState(car) {
  const speed   = Math.max(0, Math.round(Number(car.egoSpeed)       || 0));
  const setSpd  = Math.max(0, Math.round(Number(car.accSetSpeed)    || 0));
  const limit   = Math.max(0, Math.round(Number(car.fusedSpeedLimit)|| 0));
  const gear    = GEAR_MAP[Math.round(Number(car.gear) || 0)] || GEAR_FALLBACK;
  const isDrive = gear === 'D';
  const adasOn  = !!car.adasOn;
  const mads    = !!car.madsActive;
  const imp     = !!car.isImperial;

  const leftBlind   = (Number(car.leftBlindSpot)  || 0) > 0;
  const rightBlind  = (Number(car.rightBlindSpot) || 0) > 0;
  const leftBlink   = (Number(car.leftBlinker)    || 0) > 0;
  const rightBlink  = (Number(car.rightBlinker)   || 0) > 0;
  const hazardActive = leftBlink && rightBlink;

  // Speed
  fillDisp14(UI.speedDisp, formatDisplayValue(speed), 'xxl', 'mads-c');

  // Unit label
  setText(UI.unitLabel, imp ? 'MPH' : 'KMH');

  // Match web-ambient: warn only in Drive, after crossing 15% over the limit.
  const pctOver = isDrive && limit > 0 ? (speed - limit) / limit : 0;
  const overSpeed = pctOver > OVERSPEED_THRESHOLD;

  // Gear — 14-segment display
  fillDisp14(UI.gearDisp, gear, 'lg');

  // Mode strip + set speed — show state below, keep right display numeric only
  setModeState(adasOn ? 'full' : (mads ? 'mads' : ''));
  fillDisp14(UI.setDisp, adasOn && setSpd > 0 ? formatDisplayValue(setSpd) : BLANK_DISPLAY, 'md');

  // Speed limit
  const showLim = limit > 0 && gear !== 'P';
  setClassName(UI.iconLim, 'icon-lim' + (!showLim ? ' hidden' : (overSpeed ? ' active' : '')));
  fillDisp14(UI.limDisp,
    showLim ? formatDisplayValue(limit) : BLANK_DISPLAY,
    'md', 'limit-c');

  // Blind spot tape
  if (hazardActive) {
    buildBsTape('hazard', 'bs-left');
    buildBsTape('hazard', 'bs-right');
  } else {
    buildBsTape(bsTapeState(leftBlind,  leftBlink),  'bs-left');
    buildBsTape(bsTapeState(rightBlind, rightBlink), 'bs-right');
  }

}

function flushCarState() {
  renderFrame = 0;
  if (!pendingCarState) return;

  const nextCarState = pendingCarState;
  pendingCarState = null;
  renderCarState(nextCarState);
}

function receiveMessage(car) {
  pendingCarState = car;
  if (renderFrame) return;
  renderFrame = window.requestAnimationFrame(flushCarState);
}

/* ── Native bridge ── */
function readNative(method, fallback) {
  try {
    if (!window.NativeCarState) return fallback;
    const fn = window.NativeCarState[method];
    return typeof fn === 'function' ? fn.call(window.NativeCarState) : fallback;
  } catch (_) { return fallback; }
}

window.onCarStateUpdate = function() {
  receiveMessage({
    egoSpeed:            readNative('getEgoSpeed',            0),
    leftBlinker:         readNative('getLeftBlinker',         0),
    rightBlinker:        readNative('getRightBlinker',        0),
    gear:                readNative('getGear',                4),
    adasOn:              readNative('isAdasOn',               false),
    madsActive:          readNative('isMadsActive',           false),
    leftBlindSpot:       readNative('getLeftBlindSpot',       0),
    rightBlindSpot:      readNative('getRightBlindSpot',      0),
    accSetSpeed:         readNative('getAccSetSpeed',         0),
    fusedSpeedLimit:     readNative('getFusedSpeedLimit',     0),
    isImperial:          readNative('isImperial',             true),
  });
};

window.receiveMessage = receiveMessage;

function updateSafeInsets() {
  const vv = window.visualViewport;
  const width = window.innerWidth || document.documentElement.clientWidth || 0;
  const height = window.innerHeight || document.documentElement.clientHeight || 0;
  const safeLeft = vv ? Math.max(0, vv.offsetLeft) : 0;
  const safeTop = vv ? Math.max(0, vv.offsetTop) : 0;
  const safeRight = vv ? Math.max(0, width - vv.width - vv.offsetLeft) : 0;
  const safeBottom = vv ? Math.max(0, height - vv.height - vv.offsetTop) : 0;

  document.documentElement.style.setProperty('--safe-top', `${Math.ceil(safeTop)}px`);
  document.documentElement.style.setProperty('--safe-right', `${Math.ceil(safeRight)}px`);
  document.documentElement.style.setProperty('--safe-bottom', `${Math.ceil(safeBottom)}px`);
  document.documentElement.style.setProperty('--safe-left', `${Math.ceil(safeLeft)}px`);
}

function fitDashboardNow() {
  updateSafeInsets();

  const stage = UI.stage;
  if (!stage) return;

  const vv = window.visualViewport;
  const viewportWidth = vv ? vv.width : (window.innerWidth || document.documentElement.clientWidth || 0);
  const viewportHeight = vv ? vv.height : (window.innerHeight || document.documentElement.clientHeight || 0);
  const portraitLayout = viewportHeight > viewportWidth && viewportWidth < PORTRAIT_BREAKPOINT;
  document.body.classList.toggle('portrait-layout', portraitLayout);
}

function fitDashboard() {
  if (fitFrame) return;
  fitFrame = window.requestAnimationFrame(() => {
    fitFrame = 0;
    fitDashboardNow();
  });
}

initBsTape('bs-left');
initBsTape('bs-right');

window.addEventListener('resize', fitDashboard);
window.addEventListener('orientationchange', fitDashboard);
window.visualViewport && window.visualViewport.addEventListener('resize', fitDashboard);

// Default state — D, 0 mph, idle
receiveMessage({
  egoSpeed: 0, leftBlinker: 0, rightBlinker: 0,
  gear: 4, adasOn: false, madsActive: false,
  leftBlindSpot: 0, rightBlindSpot: 0,
  accSetSpeed: 0, fusedSpeedLimit: 0, isImperial: true,
});
fitDashboard();
</script>
