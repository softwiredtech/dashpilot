          sides.forEach(([bs, blinker], i) => {
            bs = parseInt(bs) || 0;
            state.bs[i].on = bs > 0 && (alwaysOn || parseInt(blinker) > 0);
            state.bs[i].urgent = bs > 1;
          });
          const dist = Number(car.stopLineDist);
          state.tlColor =
            dist > 0
              ? { 1: "red", 2: "green", 3: "yellow" }[
                  parseInt(car.trafficLightColor)
                ] || null
              : null;
          // the stop line only shows with a traffic light (not at stop signs, crosswalks or map-only stop points)
          state.stopDist = state.tlColor && dist < 127 ? dist : -1;
          // the arrow fog clears as the light gets close: full beyond TL_FOG_FAR, gone by TL_FOG_NEAR
          // (none in Reverse: the top-down view puts the car itself under it)
          const fog = gear === "R" ? 0 : state.tlColor
            ? Math.min(1, Math.max(0, (dist - TL_FOG_NEAR) / (TL_FOG_FAR - TL_FOG_NEAR)))
            : 1;
          // clearing follows the light quickly; coming back (after passing it) eases in slowly
          if (fog !== blinkerFogLevel) {
            blinkerFog.style.transitionDuration = fog > blinkerFogLevel ? TL_FOG_RETURN + "s" : "0.4s";
            blinkerFog.style.opacity = fog;
            blinkerFogLevel = fog;
          }
          state.dprCap =
            { 1: 1, 2: 1.5, 3: 2 }[parseInt(car.renderQuality)] || 2;
        }
        window.CarScene = { update, cars: MAIN_CARS, paints: PAINTS.length }; // the list and count are for the demo

        // A point on the road: s meters ahead along the curve, x meters to the left of our lane's center.
        // Returns world [x, z, heading] using the same arc as the road shader.
        // The road's center line is arcs end to end (ROAD_SHAPE), through our car at s = 0 heading along +z.
        // Each segment: [start s, start x, start z, start heading (+ toward +X), curvature (+ bends toward +X)]
        let roadSegs = [];
        function arcStep(x, z, h, k, ds) {
          if (Math.abs(k) < 1e-6) return [x + Math.sin(h) * ds, z + Math.cos(h) * ds, h];
          const h2 = h + k * ds;
          return [x + (Math.cos(h) - Math.cos(h2)) / k, z + (Math.sin(h2) - Math.sin(h)) / k, h2];
        }
        function setRoadSegs() {
          const b = ROAD_SHAPE.bend;
          let [x, z, h] = arcStep(0, 0, 0, state.curv * b[0][1], b[0][0]); // back from our car to the first start
          roadSegs = b.map(([s0, share], i) => {
            const seg = [s0, x, z, h, state.curv * share];
            if (i + 1 < b.length) [x, z, h] = arcStep(x, z, h, seg[4], b[i + 1][0] - s0);
            return seg;
          });
        }
        setRoadSegs();
        // world [x, z, heading] of the point s meters along the road and x meters across it (+ toward +X)
        function roadPoint(s, x) {
          let g = roadSegs[0];
          for (const seg of roadSegs) if (s >= seg[0]) g = seg;
          const [cx, cz, h] = arcStep(g[1], g[2], g[3], g[4], s - g[0]);
          return [cx + Math.cos(h) * x, cz - Math.sin(h) * x, h];
        }

        // ---------- drawing ----------
        // mat: { base, metal, rough, cc, emis, alpha, mode, tex, emTex } (only base, metal and rough are required)
        function drawPrim(m, mesh, mat) {
          gl.uniformMatrix4fv(carProg.u.uM, false, m);
          gl.uniform3fv(carProg.u.uBase, mat.base);
          gl.uniform1f(carProg.u.uMetal, mat.metal);
          gl.uniform1f(carProg.u.uRough, mat.rough);
          gl.uniform1f(carProg.u.uCC, mat.cc || 0);
          gl.uniform3fv(carProg.u.uEmit, mat.emis || [0, 0, 0]);
          gl.uniform1f(carProg.u.uAlpha, mat.alpha ?? 1);
          gl.uniform1f(carProg.u.uTint, mat.tint || 0);
          gl.uniform1f(
            carProg.u.uMode,
            mat.mode === "MASK" ? 1 : mat.mode === "BLEND" ? 2 : 0,
          );
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, mat.tex || white);
          gl.uniform1f(carProg.u.uHasTex, mat.tex ? 1 : 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, mat.emTex || white);
          gl.uniform1f(carProg.u.uHasEm, mat.emTex ? 1 : 0);
          gl.bindVertexArray(mesh.vao);
          gl.drawElements(gl.TRIANGLES, mesh.count, mesh.type, 0);
        }
        // Draws a car's solid parts now; its see-through parts (lamp lenses) go on the blended list,
        // drawn after everything solid. paint (optional) recolors every "Paint..." material.
        function drawCar(
          model,
          root,
          steerRad,
          paint,
          blended,
          scale = CAR_SCALE,
          flip = false, // drawing a mirror image: triangles face the other way
          tint = 0, // 0..1: whole car red (urgent warning)
        ) {
          const spin = state.travel / (model.wheelR * scale);
          for (const [name, node] of Object.entries(model.nodes)) {
            let m = M.mul(root, M.tr(...node.t));
            if (node.q) m = M.mul(m, quatMat(node.q));
            if (name.startsWith("Wheel_F") || name.startsWith("Brake_F"))
              m = M.mul(m, M.ry(steerRad));
            if (name.startsWith("Wheel")) m = M.mul(m, M.rx(spin)); // brakes steer but don't spin
            if (node.s) m = M.mul(m, M.sc(...node.s));
            for (const pr of node.prims) {
              let mat =
                paint && pr.mat.name.startsWith("Paint")
                  ? { ...pr.mat, ...paint }
                  : pr.mat;
              if (tint > 0) mat = { ...mat, tint };
              if (mat.mode === "BLEND") {
                if (!flip) blended.push([m, pr, mat, node.mirrored]);
                continue;
              }
              gl.frontFace(node.mirrored !== flip ? gl.CW : gl.CCW);
              drawPrim(m, pr, mat);
            }
          }
          gl.frontFace(gl.CCW);
          if (model.underbody) {
            for (const [hw, zf, zr, y] of model.underbody)
              drawPrim(
                M.mul(root, M.mul(M.tr(0, y, (zf + zr) / 2), M.sc(hw * 2, 0.02, zf - zr))),
                cube,
                UNDERBODY,
              );
          }
        }
        const UNDERBODY = { base: [0.018, 0.018, 0.02], metal: 0, rough: 0.6 };
        const OTHER_PAINT = {
          base: srgbToLin("#8d9298"),
          metal: 0.3,
          rough: 0.35,
        };
        const URGENT_TINT = 0.75; // how red an urgent blind-spot car turns (1 = solid red, shading kept)
        const URGENT_FADE = 4; // how fast it fades to and from red (higher = faster; 4 is about 0.75 s)
        const LAMPS = {
          // glow of a lit lamp; kept low enough that the colors stay saturated on screen
          red: [2.4, 0.015, 0.008],
          yellow: [2.2, 0.5, 0.0],
          green: [0.01, 2.0, 0.15],
        };
        function drawTrafficLight() {
          const [x, z, hd] = roadPoint(
            state.stopDist > 0 ? state.stopDist + 1.5 : 30,
            0,
          );
          const root = M.mul(M.tr(x, 0, z), M.ry(hd));
          const part = (
            mesh,
            cx,
            cy,
            cz,
            sx,
            sy,
            sz,
            base,
            metal,
            rough,
            emit,
          ) =>
            drawPrim(
              M.mul(root, M.mul(M.tr(cx, cy, cz), M.sc(sx, sy, sz))),
              mesh,
              { base, metal, rough, emis: emit },
            );
          const box = (...args) => part(cube, ...args),
            round = (...args) => part(disc, ...args);
          const grey = [0.22, 0.23, 0.24],
            dark = [0.005, 0.005, 0.005];
          box(-6.6, 2.9, 0, 0.22, 5.8, 0.22, grey, 0.6, 0.45); // pole on the right shoulder
          box(-3.3, 5.7, 0, 6.6, 0.14, 0.14, grey, 0.6, 0.45); // mast arm over the lanes
          part(housing, 0, 4.95, 0, 1, 1, 1, dark, 0.0, 0.6); // housing over our lane
          [
            ["red", 5.35],
            ["yellow", 4.95],
            ["green", 4.55],
          ].forEach(([name, y]) => {
            const lit = state.tlColor === name,
              c = LAMPS[name];
            round(
              0,
              y,
              -0.17,
              0.3,
              0.3,
              0.05,
              dark,
              0.0,
              0.2,
              lit ? c : c.map((v) => v * 0.025),
            );
            part(visor, 0, y, -0.16, 1, 1, 1, dark, 0.0, 0.6);
          });
        }

        // ---------- render loop ----------
        const SUN = norm([-0.45, 0.75, -0.35]);
        const ADAS_COLOR = srgbToLin("#5cbd68").map((v) => v * 1.6); // same green in light and dark mode
        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, state.dprCap);
          const w = Math.round(canvas.clientWidth * dpr),
            h = Math.round(canvas.clientHeight * dpr);
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
        }
        function setEnv(prog, env, day) {
          gl.uniform3fv(prog.u.uSun, SUN);
          gl.uniform3fv(prog.u.uSunC, env.sunC);
          gl.uniform3fv(prog.u.uZen, env.zen);
          gl.uniform3fv(prog.u.uHor, env.hor);
          gl.uniform3fv(prog.u.uGnd, env.gnd);
          gl.uniform3fv(prog.u.uFog, env.fog);
          gl.uniform3fv(prog.u.uAmbLo, env.ambLo);
          gl.uniform3fv(prog.u.uAmbHi, env.ambHi);
          gl.uniform1f(prog.u.uDay, day);
        }
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          state.time += dt;
          resize();
          gl.viewport(0, 0, canvas.width, canvas.height);
          // smooth the incoming values so 25 Hz updates and gear changes look natural
          state.steerShown += (state.steer - state.steerShown) * ease(dt, 12);
          state.v += (state.vTarget - state.v) * ease(dt, 4);
          state.night += (state.nightTarget - state.night) * ease(dt, 3);
          state.adas += (state.adasTarget - state.adas) * ease(dt, 4);
          state.studio += (state.studioTarget - state.studio) * ease(dt, 3);
          const studio = state.studio > 0.5; // in the studio look, no traffic or traffic light
          for (const b of state.bs) {
            // a car arriving in a blind spot is a random one of the loaded traffic cars, kept until it leaves
            if (b.on && b.p < 0.01) {
              const ready = TRAFFIC_CARS.filter((id) => models[id]);
              if (forcedTrafficCar) b.car = forcedTrafficCar; // drawn once its model has loaded
              else if (ready.length)
                b.car = ready[Math.floor(Math.random() * ready.length)];
            }
            b.p += ((b.on ? 1 : 0) - b.p) * ease(dt, 3);
            b.u += ((b.urgent ? 1 : 0) - b.u) * ease(dt, URGENT_FADE); // red fades in and out
          }
          for (const k of ["az", "el", "dist"])
            cam[k] += (view[k] - cam[k]) * ease(dt, 2.5);
          for (let i = 0; i < 3; i++)
            cam.target[i] += (view.target[i] - cam.target[i]) * ease(dt, 2.5);
          const targetK = -state.steerShown / STEER_LOCK / MIN_RADIUS;
          state.curv += (targetK - state.curv) * ease(dt, CURVE_EASE);
          setRoadSegs();
          const roadDeg = -state.steerShown / STEER_RATIO; // + = front wheels point left
          const clampDeg = (v, lim) => Math.max(-lim, Math.min(lim, v));
          const yaw = (clampDeg(roadDeg * YAW_GAIN, MAX_YAW) * Math.PI) / 180;
          const wheelDeg = clampDeg(roadDeg * WHEEL_GAIN, MAX_WHEEL);
          state.road = (state.road + state.v * dt) % 1219.2;
          state.travel += state.v * dt;

          const env = (() => {
            const n = nightEnv(state.gray),
              t = state.night,
              o = {};
            for (const k in DAY) o[k] = lerp3(DAY[k], n[k], t);
            return o;
          })();
          const day = 1 - state.night;

          const aspect = canvas.width / canvas.height,
            fov = ((aspect < 1 ? 58 : 38) * Math.PI) / 180;
          const dist = cam.dist * (aspect < 1 ? 1.25 : 1);
          const eye = [
            cam.target[0] +
              dist * Math.cos(cam.el) * Math.sin(cam.az + Math.PI),
            cam.target[1] + dist * Math.sin(cam.el),
            cam.target[2] +
              dist * Math.cos(cam.el) * Math.cos(cam.az + Math.PI),
          ];
          const fw = norm(sub(cam.target, eye)),
            rt = norm(cross(fw, [0, 1, 0])),
            up = cross(rt, fw);
          const viewM = [
            rt[0],
            up[0],
            -fw[0],
            0,
            rt[1],
            up[1],
            -fw[1],
            0,
            rt[2],
            up[2],
            -fw[2],
            0,
            -dot(rt, eye),
            -dot(up, eye),
            dot(fw, eye),
            1,
          ];
          const VP = M.mul(M.persp(fov, aspect, 0.1, 900), viewM);

          // other cars in the blind spots slide in from behind along the curved road
          const main = models[state.car];
          const others = state.bs.map((b, i) => {
            if (studio || b.p < 0.01 || !models[b.car]) return null;
            const [x, z, hd] = roadPoint(
              BS_S - (1 - b.p) * 14,
              i === 0 ? LANE : -LANE,
            );
            return {
              x,
              z,
              hd,
              p: b.p,
              urgent: b.u,
              model: models[b.car],
              id: b.car,
            };
          });
          const shadows = main ? [0, 0, yaw, 1] : [0, 0, 0, 0];
          const dims = [...(main ? main.dims : [0.82, 2.15, 1.46, -1.42])];
          for (let i = 0; i < 2; i++) {
            const o = others[i];
            shadows.push(...(o ? [o.x, o.z, o.hd, o.p] : [0, 0, 0, 0]));
            dims.push(
              ...(o
                ? o.model.dims.map((v) => v * TRAFFIC_SCALE)
                : [1, 1, 0, 0]),
            );
          }

          gl.enable(gl.DEPTH_TEST);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          // sky
          gl.useProgram(skyProg.p);
          gl.bindVertexArray(skyVao);
          setEnv(skyProg, env, day);
          gl.uniform3fv(skyProg.u.uRt, rt);
          gl.uniform3fv(skyProg.u.uUp, up);
          gl.uniform3fv(skyProg.u.uFw, fw);
          gl.uniform2f(
            skyProg.u.uTan,
            Math.tan(fov / 2) * aspect,
            Math.tan(fov / 2),
          );
          gl.depthMask(false);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.depthMask(true);
          // ground
          gl.useProgram(groundProg.p);
          gl.bindVertexArray(groundVao);
          setEnv(groundProg, env, day);
          gl.uniformMatrix4fv(groundProg.u.uVP, false, VP);
          gl.uniform3fv(groundProg.u.uCam, eye);
          gl.uniform1f(groundProg.u.uRoad, state.road);
          gl.uniform4fv(groundProg.u.uSeg, roadSegs.flatMap((g) => g.slice(1)));
          gl.uniform1fv(groundProg.u.uSegS, roadSegs.map((g) => g[0]));
          gl.uniform1f(groundProg.u.uTime, state.time);
          gl.uniform1f(groundProg.u.uStop, state.stopDist);
          gl.uniform1f(groundProg.u.uHead, state.night);
          gl.uniform1f(groundProg.u.uAdas, state.adas);
          gl.uniform3fv(groundProg.u.uAdasC, ADAS_COLOR);
          gl.uniform4fv(groundProg.u.uCars, shadows);
          gl.uniform1f(groundProg.u.uCarScale, CAR_SCALE);
          gl.uniform4fv(groundProg.u.uCarDims, dims);
          gl.uniform1f(groundProg.u.uNose, main ? main.bmax[2] : 2.3);
          gl.uniform1f(groundProg.u.uStudio, state.studio);
          gl.uniform3fv(
            groundProg.u.uFloor,
            env.fog.map((f) =>
              untonemap(
                lerp(
                  tonemap1(f) * STUDIO_FLOOR,
                  STUDIO_FLOOR_DARK,
                  state.night,
                ),
              ),
            ),
          );
          gl.drawArrays(gl.TRIANGLES, 0, 6);
          // cars and traffic light
          gl.useProgram(carProg.p);
          // cars (and the traffic light) keep daytime lighting in both modes so they stay crisp;
          // only the fog follows the night scene
          setEnv(carProg, { ...DAY, fog: env.fog }, 1);
          gl.uniformMatrix4fv(carProg.u.uVP, false, VP);
          gl.uniform3fv(carProg.u.uCam, eye);
          if (state.tlColor && !studio) drawTrafficLight();
          gl.uniform1i(carProg.u.uTex, 0);
          gl.uniform1i(carProg.u.uEmTex, 1);
          const carSize = M.sc(CAR_SCALE, CAR_SCALE, CAR_SCALE);
          const ts = CAR_SCALE * TRAFFIC_SCALE,
            trafficSize = M.sc(ts, ts, ts);
          const blended = [];
          if (main && state.studio > 0.01) {
            // Park studio: a faint mirror image of the car in the floor. Depth first (so the image hides
            // its own far side), then color blended over the floor; then the depth is cleared so the
            // real car draws over it.
            const steer = (wheelDeg * Math.PI) / 180,
              mirror = M.mul(M.sc(1, -1, 1), M.mul(M.ry(yaw), carSize));
            gl.uniform1f(carProg.u.uReflectFade, REFLECT_FADE * CAR_SCALE);
            gl.uniform1f(carProg.u.uReflect, REFLECT * state.studio);
            gl.clear(gl.DEPTH_BUFFER_BIT);
            gl.colorMask(false, false, false, false);
            drawCar(main, mirror, steer, paintOf(state.paint), [], CAR_SCALE, true);
            gl.colorMask(true, true, true, true);
            gl.depthFunc(gl.LEQUAL);
            gl.depthMask(false);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            drawCar(main, mirror, steer, paintOf(state.paint), [], CAR_SCALE, true);
            gl.disable(gl.BLEND);
            gl.depthMask(true);
            gl.depthFunc(gl.LESS);
            gl.uniform1f(carProg.u.uReflect, 0);
            gl.clear(gl.DEPTH_BUFFER_BIT);
          }
          if (main) {
            const root = M.mul(M.ry(yaw), carSize);
            drawCar(
              main,
              root,
              (wheelDeg * Math.PI) / 180,
              paintOf(state.paint),
              blended,
            );
            // on-screen bounds of our car, for tap-to-change-paint
            const r = canvas.getBoundingClientRect();
            let x0 = Infinity,
              y0 = Infinity,
              x1 = -Infinity,
              y1 = -Infinity;
            for (const cx of [main.bmin[0], main.bmax[0]])
              for (const cy of [main.bmin[1], main.bmax[1]])
                for (const cz of [main.bmin[2], main.bmax[2]]) {
                  const p = M.xf(VP, M.xf(root, [cx, cy, cz]));
                  if (p[3] <= 0) continue;
                  const sx = r.left + ((p[0] / p[3]) * 0.5 + 0.5) * r.width,
                    sy = r.top + (0.5 - (p[1] / p[3]) * 0.5) * r.height;
                  x0 = Math.min(x0, sx);
                  y0 = Math.min(y0, sy);
                  x1 = Math.max(x1, sx);
                  y1 = Math.max(y1, sy);
                }
            carRect = [x0, y0, x1, y1];
          }
          // traffic: grey (the Cybertruck keeps its bare stainless); the whole car turns red when urgent
          for (const o of others)
            if (o)
              drawCar(
                o.model,
                M.mul(M.tr(o.x, 0, o.z), M.mul(M.ry(o.hd), trafficSize)),
                0,
                o.id === "cybertruck" ? null : OTHER_PAINT,
                blended,
                CAR_SCALE * TRAFFIC_SCALE,
                false,
                o.urgent * URGENT_TINT,
              );
          // see-through parts last, so what's behind them shows through
          if (blended.length) {
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.depthMask(false);
            for (const [m, pr, mat, mirrored] of blended) {
              gl.frontFace(mirrored ? gl.CW : gl.CCW);
              drawPrim(m, pr, mat);
            }
            gl.frontFace(gl.CCW);
            gl.depthMask(true);
            gl.disable(gl.BLEND);
          }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // Our car first (the saved choice, or ?car=model3 for testing in a browser);
        // the other traffic cars load in the background afterwards
        const urlCar = new URLSearchParams(location.search).get("car");
        if (MAIN_CARS.includes(urlCar)) state.car = urlCar;
        loadCar(state.car)
          .then(() => {
            statusEl.hidden = true;
            TRAFFIC_CARS.forEach((id) => loadCar(id).catch(() => {}));
          })
          .catch((err) => {
            statusEl.textContent =
              "The 3D model could not be loaded. " + err.message;
          });
      })();
    </script>

    <script>
      const leftBlinkerIcon = document.getElementById("leftBlinkerIcon");
      const rightBlinkerIcon = document.getElementById("rightBlinkerIcon");

      function showBlinker(blinkerState, blinkerIcon) {
        if (blinkerState == 2) {
          blinkerIcon.style.opacity = "1";
        } else if (blinkerState == 1) {
          blinkerIcon.style.opacity = "0.3";
        } else {
          blinkerIcon.style.opacity = "0.0";
        }
      }

      function applyBlindSpotBorderEffect(blindSpotState, blindSpotView) {
        blindSpotView.style.display = blindSpotState > 0 ? "block" : "none";
      }

      var receiveMessage = function (car) {
        try {
          document.body.classList.toggle("dark-mode", !!car.darkMode);

          window.CarScene.update(car);

          const angle = car.egoSteeringAngle;
          const speed = parseInt(car.egoSpeed);
          const gear = parseInt(car.gear);
          const leftBlinker = parseInt(car.leftBlinker);
          const rightBlinker = parseInt(car.rightBlinker);
          const speedLimit = parseInt(car.fusedSpeedLimit);

          // Show gears
          const gearMap = { 1: "P", 2: "R", 3: "N", 4: "D" };
          gearText.textContent = gearMap[gear] || "-";

          showBlinker(leftBlinker, leftBlinkerIcon);
          showBlinker(rightBlinker, rightBlinkerIcon);

          speedText.textContent = speed;
          speedUnit.textContent = car.isImperial ? "mph" : "km/h";

          const isParked = gearMap[gear] == "P";

          if (isParked || speedLimit == 0) {
            speedLimitText.textContent = "";
          } else {
            speedLimitText.textContent = speedLimit;
          }
          document.getElementById("speedSignRow").style.display = isParked
            ? "none"
            : "flex";
          document.getElementById("speedLimitSign").style.visibility =
            speedLimitText.textContent ? "visible" : "hidden";

          const accSet = parseInt(car.accSetSpeed);

          if (!isParked && accSet > 0) {
            accValue.textContent = accSet;
            accMax.textContent = "max";
          } else {
            accValue.textContent = "";
            accMax.textContent = "";
          }

          accSetSpeed.style.color = car.adasOn ? "#5cbd68" : "#d3d3d3";

          applyBlindSpotBorderEffect(car.leftBlindSpot, leftBlindSpot);
          applyBlindSpotBorderEffect(car.rightBlindSpot, rightBlindSpot);

          const buckle = car.buckleStatus;
          seatbeltIcon.style.display =
            buckle != null && buckle == 0 ? "block" : "none";

          // Door open warning
          const door = car.anyDoorOpen;
          doorIcon.style.display = door != null && door > 0 ? "block" : "none";

          // Phone battery
          const phoneBatGroup = document.getElementById("phoneBatteryGroup");
          if (car.showPhoneBattery) {
            const phoneBat = car.phoneBattery;
            if (phoneBat != null && phoneBat >= 0) {
              phoneBatGroup.style.display = "flex";
              document.getElementById("phoneBatteryFill").style.width =
                phoneBat + "%";
              document.getElementById("phoneBatteryPercent").textContent =
                phoneBat + "%";
              if (phoneBat <= 20) {
                document.getElementById("phoneBatteryFill").style.background =
                  "#ff4444";
              } else {
                document.getElementById("phoneBatteryFill").style.background =
                  "#4a90d9";
              }
            }
          } else {
            phoneBatGroup.style.display = "none";
          }

          // Show separator only when both phone and car groups are visible
          document.getElementById("statusSeparator").style.display =
            car.showPhoneBattery && car.showCarBattery ? "block" : "none";

          // Battery SOC + temperature widget
          if (car.showCarBattery) {
            const fullPack = car.fullPackEnergy;
            const remaining = car.nominalEnergyRemaining;
            const buffer = car.energyBuffer;
            const tMin = car.packTMin;
            const tMax = car.packTMax;
            const hasBattery =
              fullPack > 0 && remaining > 0 && fullPack - buffer > 0;
            const hasTemp =
              tMin != null && tMax != null && (tMin > 0 || tMax > 0);

            if (hasBattery || hasTemp) {
              document.getElementById("carBatteryGroup").style.display = "flex";
            }
            if (hasBattery) {
              const soc = Math.round(
                ((remaining - buffer) / (fullPack - buffer)) * 100,
              );
              const clampedSoc = Math.max(0, Math.min(100, soc));
              document.getElementById("carBatteryFill").style.width =
                clampedSoc + "%";
              document.getElementById("carBatteryPercent").textContent =
                soc + "%";
              if (clampedSoc <= 20) {
                document.getElementById("carBatteryFill").style.background =
                  "#ff4444";
              } else {
                document.getElementById("carBatteryFill").style.background =
                  "#5cbd68";
              }
            }
            if (hasTemp) {
              const avgTemp = (tMin + tMax) / 2;
              document.getElementById("batteryTempText").textContent =
                avgTemp.toFixed(0) + (car.isImperial ? "°F" : "°C");
            }
          } else {
            document.getElementById("carBatteryGroup").style.display = "none";
          }

          // Power bar
          const powerLevel = car.powerLevel;
          if (
            powerLevel != null &&
            car.maxDischargePower > 0 &&
            car.maxRegenPower > 0
          ) {
            document.getElementById("powerBar").style.display = "flex";
            const fill = document.getElementById("powerBarFill");
            const pct = Math.abs(powerLevel) / 2;
            if (powerLevel >= 0) {
              // Discharging — bar goes up from center
              fill.style.top = 50 - pct + "%";
              fill.style.height = pct + "%";
              fill.style.background = "#555";
            } else {
              // Regenerating — bar goes down from center
              fill.style.top = "50%";
              fill.style.height = pct + "%";
              fill.style.background = "#5cbd68";
            }
          }

          // Odometer
          if (car.showOdometer) {
            const odo = car.odometer;
            if (odo != null && odo > 0) {
              document.getElementById("odometer").textContent =
                Math.round(odo).toLocaleString() +
                (car.isImperial ? " mi" : " km");
              document.getElementById("bottomLeft").style.display = "flex";
            }
          } else {
            document.getElementById("bottomLeft").style.display = "none";
          }

          // Experimental mode icon
          document.getElementById("experimentalIcon").style.display =
            car.experimentalMode ? "block" : "none";

          // Steering wheel: colorize green when ADAS or MADS is active
          if (car.adasOn || car.madsActive) {
            steeringWheel.style.filter =
              "brightness(0) saturate(100%) invert(68%) sepia(52%) saturate(405%) hue-rotate(88deg) brightness(92%) contrast(87%)";
          } else {
            steeringWheel.style.filter = "";
          }

          // Rotate the steering wheel
          steeringWheel.style.transform = `rotate(${angle}deg)`;

          // Driver alerts
          const native = window.NativeCarState;
          const camDist =
            car.speedCameraDistance ?? native?.getSpeedCameraDistance?.() ?? -1;
          const isChangingLane =
            car.changingLane ?? native?.isChangingLane?.() ?? false;
          const alertEl = document.getElementById("driverAlert");
          if (isChangingLane) {
            alertEl.textContent = "Changing lane";
            alertEl.style.display = "block";
          } else if (camDist > 0) {
            alertEl.textContent = "Speed camera " + camDist + "m ahead";
            alertEl.style.display = "block";
          } else {
            alertEl.style.display = "none";
          }
        } catch (err) {
          console.error("Failed to parse message", err);
        }
      };

      window.onCarStateUpdate = function () {
        var car = {
          egoSteeringAngle: NativeCarState.getEgoSteeringAngle(),
          egoSpeed: NativeCarState.getEgoSpeed(),
          leftBlinker: NativeCarState.getLeftBlinker(),
          rightBlinker: NativeCarState.getRightBlinker(),
          gear: NativeCarState.getGear(),
          adasOn: NativeCarState.isAdasOn(),
          leftBlindSpot: NativeCarState.getLeftBlindSpot(),
          rightBlindSpot: NativeCarState.getRightBlindSpot(),
          fusedSpeedLimit: NativeCarState.getFusedSpeedLimit(),
          stopLineDist: NativeCarState.getStopLineDist(),
          trafficLightColor: NativeCarState.getTrafficLightColor(),
          buckleStatus: NativeCarState.getBuckleStatus?.() ?? undefined,
          anyDoorOpen: NativeCarState.getAnyDoorOpen?.() ?? undefined,
          accSetSpeed: NativeCarState.getAccSetSpeed?.() ?? undefined,
          odometer: NativeCarState.getOdometer?.() ?? undefined,
          phoneBattery: NativeCarState.getPhoneBattery?.() ?? undefined,
          fullPackEnergy: NativeCarState.getFullPackEnergy?.() ?? undefined,
          nominalEnergyRemaining:
            NativeCarState.getNominalEnergyRemaining?.() ?? undefined,
          energyBuffer: NativeCarState.getEnergyBuffer?.() ?? undefined,
          packTMin: NativeCarState.getPackTMin?.() ?? undefined,
          packTMax: NativeCarState.getPackTMax?.() ?? undefined,
          maxRegenPower: NativeCarState.getMaxRegenPower?.() ?? undefined,
          maxDischargePower:
            NativeCarState.getMaxDischargePower?.() ?? undefined,
          packVoltage: NativeCarState.getPackVoltage?.() ?? undefined,
          packCurrent: NativeCarState.getPackCurrent?.() ?? undefined,
          powerLevel: NativeCarState.getPowerLevel?.() ?? undefined,
          showPhoneBattery: NativeCarState.getShowPhoneBattery?.() ?? true,
          showCarBattery: NativeCarState.getShowCarBattery?.() ?? true,
          showOdometer: NativeCarState.getShowOdometer?.() ?? true,
          isImperial: NativeCarState.isImperial?.() ?? false,
          darkMode: NativeCarState.isDarkMode?.() ?? false,
          alwaysOnBlindSpotMonitor:
            NativeCarState.isAlwaysOnBlindSpotMonitor?.() ?? true,
          experimentalMode: NativeCarState.isExperimentalMode?.() ?? false,
          madsActive: NativeCarState.isMadsActive?.() ?? false,
          renderQuality: NativeCarState.getRenderQuality?.() ?? 3,
          darkModeBackgroundGray:
            NativeCarState.getDarkModeBackgroundGray?.() ?? 0,
        };
        receiveMessage(car);
      };

      window.receiveMessage = receiveMessage;

      // In a desktop browser: ?demo plays a made-up drive (add &dark=1, &gear=P|R|N|D);
      // otherwise connect to a local websocket feed like web-vanilla does.
      (function () {
        const params = new URLSearchParams(location.search);
        // ?demo=cycle: a 34 s loop. Park showing each of the cars in turn -> drive away, cycling through the
        // paints, cruise past a Cybertruck, slow for a red light that turns green and drive through it,
        // slow to a stop -> reverse a little -> Park.
        if (params.get("demo") === "cycle") {
          const SHOWCASE = 8, // s in Park at the start, split between the cars
            LOOP = 26 + SHOWCASE;
          const cars = window.CarScene.cars || [],
            paints = window.CarScene.paints || 1;
          const CAR_TIME = SHOWCASE / Math.max(cars.length, 1),
            PAINT_TIME = 20 / paints; // the drive (4-24 s on the timeline below) shows every paint
          const LIGHT_AT = 13, // s: a traffic light appears this far ahead,
            LIGHT_DIST = 70, // m
            LIGHT_GREEN = 17; // s: red until here, then green
          const ramp = (t, a, b) => {
            const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
            return x * x * (3 - 2 * x);
          };
          const t0 = performance.now();
          let lastT = 0,
            lineDist = 0; // meters to the traffic light's stop line, counted down as the car drives
          setInterval(() => {
            const r = ((performance.now() - t0) / 1000) % LOOP;
            // the timeline below runs 0-30 s with Park until 4 s; the showcase stretches that Park to SHOWCASE
            const t = r < SHOWCASE ? (r * 4) / SHOWCASE : r - SHOWCASE + 4;
            const dt = t >= lastT ? t - lastT : 0;
            lastT = t;
            let gear, speed, steer, power;
            if (t < 4) {
              // parked
              gear = 1; speed = 0; steer = 0; power = 0;
            } else if (t < 24) {
              // drive: pull away (4-9 s), cruise with gentle curves (9-12 s), slow for the red light (13-16.5 s),
              // speed back up when it turns green and drive through (17-20 s), slow to a stop (21-24 s)
              gear = 4;
              speed =
                62 * ramp(t, 4.5, 9) -
                40 * ramp(t, 13, 16.5) +
                40 * ramp(t, 17.2, 19.5);
              speed *= 1 - ramp(t, 21, 23.6);
              steer = Math.round(Math.sin((t - 4) * 0.6) * 45 * ramp(t, 6, 8) * (1 - ramp(t, 11, 13)));
              power =
                t < 9 ? 55 * (1 - ramp(t, 8, 9))
                : t < 13 ? 12
                : t < 17 ? -35
                : t < 19.5 ? 40
                : t < 21 ? 12
                : -50 * (1 - ramp(t, 23, 24));
            } else if (t < 28) {
              // reverse a few meters at walking pace, turning a little
              gear = 2;
              speed = 5 * ramp(t, 24.5, 25.5) * (1 - ramp(t, 26.8, 27.8));
              steer = -120 * ramp(t, 24.5, 25.5);
              power = speed > 0.5 ? 8 : 0;
            } else {
              // back in Park
              gear = 1; speed = 0; steer = 0; power = 0;
            }
            const driving = gear === 4 && t > 6 && t < 22;
            // the traffic light: appears LIGHT_DIST ahead, gets closer as the car drives, gone once passed
            if (t < LIGHT_AT) lineDist = LIGHT_DIST;
            else lineDist = Math.max(0, lineDist - (speed / 3.6) * dt);
            receiveMessage({
              egoSteeringAngle: steer,
              egoSpeed: Math.round(speed),
              gear,
              // left blinker and a Cybertruck in the left blind spot during the cruise
              leftBlinker: t > 9.5 && t < 12 ? (Math.floor(t * 2.5) % 2 ? 2 : 1) : 0,
              demoTrafficCar: "cybertruck",
              demoCar: cars[Math.min(Math.floor(r / CAR_TIME), cars.length - 1)],
              demoPaint: Math.min(Math.floor(Math.max(t - 4, 0) / PAINT_TIME), paints - 1),
              rightBlinker: 0,
              adasOn: driving,
              accSetSpeed: driving ? 65 : 0,
              fusedSpeedLimit: 70,
              // the warning turns urgent (2: signaling into the occupied lane) halfway through
              leftBlindSpot: t > 9 && t < 12.5 ? (t > 10.3 && t < 11.8 ? 2 : 1) : 0,
              rightBlindSpot: 0,
              stopLineDist: t >= LIGHT_AT ? lineDist : 0,
              trafficLightColor: t >= LIGHT_AT && lineDist > 0 ? (t < LIGHT_GREEN ? 1 : 2) : 0,
              phoneBattery: 76,
              showPhoneBattery: true,
              showCarBattery: true,
              showOdometer: true,
              fullPackEnergy: 75,
              nominalEnergyRemaining: 52,
              energyBuffer: 3,
              packTMin: 28,
              packTMax: 31,
              powerLevel: Math.round(power),
              maxDischargePower: 250,
              maxRegenPower: 80,
              odometer: 18452,
              darkMode: params.get("dark") === "1",
              darkModeBackgroundGray: 0,
              alwaysOnBlindSpotMonitor: true,
              buckleStatus: 1,
              renderQuality: 3,
            });
          }, 40);
          return;
        }
        if (params.has("demo")) {
          const gear = { P: 1, R: 2, N: 3, D: 4 }[params.get("gear")] || 4;
          const t0 = performance.now();
          setInterval(() => {
            const t = (performance.now() - t0) / 1000,
              cycle = t % 16;
            receiveMessage({
              egoSteeringAngle: Math.round(Math.sin(t * 0.35) * 60),
              egoSpeed: gear === 1 ? 0 : 62,
              gear,
              leftBlinker:
                cycle > 9 && cycle < 13 ? (Math.floor(t * 2.5) % 2 ? 2 : 1) : 0,
              rightBlinker: 0,
              adasOn: t % 20 > 3,
              accSetSpeed: 65,
              fusedSpeedLimit: 70,
              leftBlindSpot: cycle > 6 && cycle < 13 ? 1 : 0,
              rightBlindSpot: cycle > 2 && cycle < 5 ? 1 : 0,
              stopLineDist: Math.max(0, 110 - (t % 14) * 9),
              trafficLightColor: [2, 3, 1][Math.floor(t / 14) % 3],
              phoneBattery: 76,
              showPhoneBattery: true,
              showCarBattery: true,
              showOdometer: true,
              fullPackEnergy: 75,
              nominalEnergyRemaining: 52,
              energyBuffer: 3,
              packTMin: 28,
              packTMax: 31,
              // power bar: swings between using power (up to 70%) and regen braking (down to -60%) every ~10 s
              powerLevel:
                gear === 1 ? 0 : Math.round(Math.sin(t * 0.6) * 65 + 5),
              maxDischargePower: 250,
              maxRegenPower: 80,
              odometer: 18452,
              darkMode: params.get("dark") === "1",
              darkModeBackgroundGray: 0,
              alwaysOnBlindSpotMonitor: true,
              buckleStatus: 1,
              renderQuality: 3,
            });
          }, 40);
          return;
        }
        if (typeof NativeCarState !== "undefined") return;
        const ws = new WebSocket(
          `ws://${window.location.hostname || "localhost"}:8080`,
        );
        ws.onopen = () => console.log("WebSocket connected");
        ws.onmessage = (event) => receiveMessage(JSON.parse(event.data));
        ws.onerror = (err) => console.error("WebSocket error", err);
        ws.onclose = () => console.log("WebSocket closed");
      })();
    </script>
  </body>
</html>
