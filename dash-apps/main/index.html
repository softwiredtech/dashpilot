<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>PilotBoard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111;
    }

    #outerBorder {
      position: fixed;
      inset: 0;
      background: #5cbd68;
      padding: 8px;
      box-sizing: border-box;
    }

    /* This inner container makes the outer border rounded in the inside*/
    #innerContainer {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-sizing: border-box;
    }

    #canvas-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85vw;
      height: 85vh;
      z-index: 1;
    }

    #bevy-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    #speedLimitSign {
      position: fixed;
      top: 50px;
      right: 40px;
      width: 80px;
      height: 80px;
      border: 8px solid red;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: "Inter", sans-serif;
      color: black;
      font-size: 36px;
      font-weight: 600;
      user-select: none;
      box-sizing: border-box;
      z-index: 2000;
    }

    #leftBlindSpot {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(to right, rgba(255,0,0,0.5), rgba(255,0,0,0));
      z-index: 1000;
      display: none;
    }

    #rightBlindSpot {
      position: fixed;
      top: 0;
      right: 0;
      width: 150px;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(to left, rgba(255,0,0,0.5), rgba(255,0,0,0));
      z-index: 1000;
      display: none;
    }

    #leftColumn {
      position: fixed;
      top: 80px;
      left: 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      z-index: 2000;
    }

    #speedRow {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    #speedText {
      font-size: 72px;
      font-weight: 300;
      line-height: 1;
    }

    #speedUnit {
      font-size: 18px;
      color: #777;
    }

    #gearText {
      font-size: 18px;
      font-weight: 500;
      padding: 4px 24px;
      border-radius: 6px;
      background: rgb(173,179,179);
      color: #fff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 50px;
      height: 32px;
      box-sizing: border-box;
    }

    #steeringContainer {
      position: relative;
      width: 70px;
      height: 70px;
      margin-top: 12px;
      color: rgb(94,95,97);
    }

    #steeringWheel {
      width: 100%;
      height: 100%;
      transition: transform 0.1s linear;
    }

    #blinkerRow {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 2000;
    }

    #leftBlinkerIcon,
    #rightBlinkerIcon {
      width: 34px;
    }

    #steeringAngleRow {
      display: none;
      margin-top: 8px;
      font-size: 16px;
      color: #666;
    }

    #steeringAngle {
      font-weight: 500;
      color: #111;
    }
  </style>
</head>
<body>
   <div id="outerBorder">
    <div id="innerContainer">
  <div id="canvas-container">
    <canvas id="bevy-canvas"></canvas>
  </div>

  <div id="leftBlindSpot"></div>
  <div id="rightBlindSpot"></div>
  
  <div id="speedLimitSign">
    <span id="speedLimitText">50</span>
  </div>
  
  <div id="blinkerRow">
    <img id="leftBlinkerIcon" src="left.png" style="opacity: 0.0;" />
    <img id="rightBlinkerIcon" src="right.png" style="opacity: 0.0;" />
  </div>
  
  <div id="leftColumn">
    <div id="speedRow">
      <div id="speedText">0</div>
      <div id="speedUnit">km/h</div>
    </div>

    <div id="gearText">-</div>

    <div id="steeringContainer">
      <img id="steeringWheel" src="steering-wheel.svg" />
    </div>
    </div>
    </div>
  </div>

  <script>
    const leftBlinkerIcon = document.getElementById("leftBlinkerIcon");
    const rightBlinkerIcon = document.getElementById("rightBlinkerIcon");
    let leftHideTimeout = null;
    let rightHideTimeout = null;

    function showBorder(show) {
      const wrapper = document.getElementById("borderWrapper");
      wrapper.style.background = show ? "#5cbd68" : "#C1E7C8";
    }

    function showBlinker(blinkerState, blinkerIcon) {
      if (blinkerState == 2) {
          blinkerIcon.style.opacity = "1";
        } else if (blinkerState == 1) {
          blinkerIcon.style.opacity = "0.3";
        } else {
          blinkerIcon.style.opacity = "0.0";
        }
    }

    function applyBlindSpotListener(blindSpotState, hideTimeout, blindSpotView) {
      if (blindSpotState > 0) {
        if (hideTimeout) {
          clearTimeout(hideTimeout);
          hideTimeout = null;
        }
        blindSpotView.style.display = "block";
      } else if (!hideTimeout) {
        hideTimeout = setTimeout(() => {
          blindSpotView.style.display = "none";
          hideTimeout = null;
        }, 1000);
      }
      return hideTimeout;
    }

    const TL_COLOR_MAP = { 1: "Red", 2: "Green", 3: "Yellow" };
    const TL_FIXED_DY = -3.0;

    function buildTrafficLightState(world) {
        const dist = world.stopLineDist;
        const colorName = TL_COLOR_MAP[world.trafficLightColor];

        if (colorName && dist != null && dist > 0) {
          world.traffic_lights = [{
            id: 1,
            Dx: dist,
            Dy: TL_FIXED_DY,
            state: colorName,
          }];
        } else {
          world.traffic_lights = [];
        }

        if (dist != null && dist > 0 && dist < 127) {
          world.stop_line_dist = dist;
        } else {
          world.stop_line_dist = null;
        }
      }

    const BS_DX = -3.0;
    const BS_DY_LEFT = 4.0;
    const BS_DY_RIGHT = -4.0;
    const BS_LEFT_ID = 9990;
    const BS_RIGHT_ID = 9991;

    function buildBlindSpotState(world) {
      const objects = (world.objects || []).filter(o => o.id !== BS_LEFT_ID && o.id !== BS_RIGHT_ID);

      if (world.leftBlindSpot > 0) {
        objects.push({
          id: BS_LEFT_ID,
          Dx: BS_DX,
          Dy: BS_DY_LEFT,
          VxRel: 0,
          vehicle_class: "Car",
          heading: 0,
        });
      }

      if (world.rightBlindSpot > 0) {
        objects.push({
          id: BS_RIGHT_ID,
          Dx: BS_DX,
          Dy: BS_DY_RIGHT,
          VxRel: 0,
          vehicle_class: "Car",
          heading: 0,
        });
      }

      world.objects = objects;
    }

    const ws = new WebSocket("ws://192.168.1.105:8080");
    const speedText = document.getElementById("speedText");
    const steeringAngleText = document.getElementById("steeringAngle");
    const steeringWheel = document.getElementById("steeringWheel");
    

    ws.onopen = () => console.log("WebSocket connected");

    var receiveMessage = function(event) {
      try {
        const data = JSON.parse(event.data);

        const speed = parseInt(data.world.ego_speed);
        const angle = data.world.ego_steering_angle;

        if (!data.world) data.world = {};
        if (data.world.gear == null) {
          data.world.gear = 4;
        }

        const gear = parseInt(data.world.gear);
        const leftBlinker = parseInt(data.world.leftBlinker);
        const rightBlinker = parseInt(data.world.rightBlinker);
        const speedLimit = parseInt(data.world.fusedSpeedLimit);
        const roundedSpeed = Math.floor(speed / 10) * 10;
        
        buildTrafficLightState(data.world);
        buildBlindSpotState(data.world);

        const IN_MIN = -360;
        const IN_MAX =  360;

        // OUTPUT desired range
        const OUT_MIN = -30;
        const OUT_MAX =  30;

        const remappedDeg =
        (angle - IN_MIN) * (OUT_MAX - OUT_MIN) / (IN_MAX - IN_MIN) + OUT_MIN;

        const remappedRad = -remappedDeg * Math.PI / 180;
        const speedMs = roundedSpeed / 3.6;

        data.world.ego_steering_angle = remappedRad;
        data.world.ego_speed = speedMs;

        // Serialize
        window.__ADAS_DATA_JSON__ = JSON.stringify(data.world);

        const gearMap = { 1: "P", 2: "R", 3: "N", 4: "D" };
        gearText.textContent = gearMap[gear] || "-";

        showBlinker(leftBlinker, leftBlinkerIcon);
        showBlinker(rightBlinker, rightBlinkerIcon);

        speedText.textContent = speed;
        if (speedLimit == 31 || speedLimit == 0) {
          speedLimitText.textContent = "";
        } else {
          speedLimitText.textContent = speedLimit;
        }

        leftHideTimeout = applyBlindSpotListener(
          data.world.leftBlindSpot,
          leftHideTimeout,
          leftBlindSpot
        );

        rightHideTimeout = applyBlindSpotListener(
          data.world.rightBlindSpot,
          rightHideTimeout,
          rightBlindSpot
        );

        if (data.world.adas_on) {
          outerBorder.style.background = "#5cbd68";
        } else {
          outerBorder.style.background = "#C1E7C8";
        }

        // Rotate the steering wheel
        steeringWheel.style.transform = `rotate(${angle}deg)`;
      } catch (err) {
        console.error("Failed to parse message", err);
      }
    };

    ws.onmessage = function(event) {
      receiveMessage(event);
    };

    ws.onerror = (err) => console.error("WebSocket error", err);
    ws.onclose = () => console.log("WebSocket closed");

    // Incoming from dashpilot android app
    window.onWorldMessage = function(message) {
      receiveMessage({event: { data: message }});
    }
  </script>

  <script type="module">
    import init from './car-visualization.js';
    (async () => {
      try {
        await init();
        console.log('[WASM] Bevy initialized');
      } catch (e) {
        if (!e.message?.includes("control flow")) {
          console.error("[WASM] init failed:", e);
        }
      }
    })();
  </script>
</body>
</html>
