<!DOCTYPE html>
<html>
<body>
  <div id="speed" style="font-size:48px">0</div>
  <div id="blinker"></div>
  <script>
    const speedEl = document.getElementById("speed");
    const blinkerEl = document.getElementById("blinker");

    window.onCarStateUpdate = function () {
      speedEl.textContent = Math.round(window.NativeCarState.getEgoSpeed());
      blinkerEl.textContent = window.NativeCarState.getLeftBlinker() ? "◀" : "";
      // Burn measurable CPU per tick: Windows reports process.cpuUsage() in
      // ~16ms quanta, so a trivial tick would read 0 and fail the
      // steadyProcessCpuMs > 0 assertion. We busy-loop for exactly 2.2ms
      // per tick, which is immune to JIT optimization and stays safely under the 3ms budget.
      const end = performance.now() + 2.2;
      while (performance.now() < end) {}
    };
  </script>
</body>
</html>
