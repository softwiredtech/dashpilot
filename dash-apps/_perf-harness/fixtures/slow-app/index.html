<!DOCTYPE html>
<html>
<body>
  <div id="speed">0</div>
  <script>
    const el = document.getElementById("speed");

    window.onCarStateUpdate = function () {
      const end = performance.now() + 80;
      while (performance.now() < end) {}
      el.textContent = Math.round(window.NativeCarState.getEgoSpeed());
    };
  </script>
</body>
</html>
