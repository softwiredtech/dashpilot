<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>DashPilot Minimal Ambient</title>
  <style>
    @font-face {
      font-family: "Geist Mono";
      font-style: normal;
      font-weight: 200;
      font-display: swap;
      src: url("fonts/geist-mono-200.woff2") format("woff2");
    }

    :root {
      --bg: #0a0b0d;
      --fg: #f1efe9;
      --muted: #aaa79d;
      --off: #d8c39a;
      --mads: #00C8C8;
      --full: #60F594;
      --red: #ff7575;
      --edge: var(--off);
      --accent: var(--off);
    }

    /* Light theme — daylight glance: the warm/cool relationship inverts.
       The night cabin's warm text becomes the paper field; the cool night
       field becomes the ink. Mode colors keep their hue but flip from
       emissive pastel to printed ink. */
    :root[data-theme="light"] {
      --bg: #ece9e2;
      --fg: #16181c;
      --muted: #6e695d;
      --off: #7d6029;
      --mads: #007078;
      --full: #007a3c;
      --red: #b32424;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(241, 239, 233, 0.07) 0%, var(--bg) 70%);
      transition: background 0.4s ease;
    }

    [data-theme="light"] #app {
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.55) 0%, var(--bg) 70%);
    }

    [data-theme="light"] #app::after { opacity: 0.045; }

    #app::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    }

    #edgeAccent {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      transition: background 0.8s ease;
    }

    #breathLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      animation: ambientBreathe 4.5s ease-in-out infinite;
      transition: background 0.6s ease;
    }

    #ambientLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      animation: ambientWash 6.5s ease-in-out infinite;
      animation-delay: -2.1s;
      transition: background 0.6s ease;
    }

    @keyframes ambientWash {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.50; }
    }

    @keyframes ambientBreathe {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    #speedLayer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #speedWrap {
      position: relative;
      line-height: 0.82;
    }

    #speed {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(150px, min(33vw, 65vh), 280px);
      font-weight: 200;
      letter-spacing: -0.06em;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      transition: color 0.25s ease, text-shadow 0.25s ease;
      user-select: none;
    }

    #setSpeedWrap {
      position: absolute;
      left: 100%;
      top: 18px;
      margin-left: 24px;
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      user-select: none;
    }

    #setSpeed {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(58px, 10.5vw, 96px);
      font-weight: 200;
      line-height: 0.85;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    #assistLabel {
      grid-column: 2;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
      user-select: none;
    }

    #assistDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: breathe 4.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #topRow {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    #gearChip {
      padding: 8px 22px;
      border-radius: 4px;
      background: #1a1a17;
      color: var(--fg);
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.18em;
      display: none;
      user-select: none;
    }

    #warningChips {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    #bottomRow {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 44px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      text-shadow: 0 0 10px rgba(241,239,233,0.25), 0 0 24px rgba(241,239,233,0.12);
    }

    .chip {
      padding: 9px 18px;
      border-radius: 4px;
      font-size: 20px;
      letter-spacing: 0.08em;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .chip-red {
      background: rgba(255, 60, 60, 0.22);
      color: #ff7575;
    }

    .chip-amber {
      background: rgba(245, 185, 66, 0.18);
      color: #f5b942;
    }

    [data-theme="light"] .chip-red {
      background: rgba(179, 36, 36, 0.12);
      color: var(--red);
    }

    [data-theme="light"] .chip-amber {
      background: rgba(140, 92, 0, 0.14);
      color: #8c5c00;
    }

    #leftFlash,
    #rightFlash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #leftFlash.urgent,
    #rightFlash.urgent {
      animation: flashPulse 0.85s ease-in-out infinite;
      transition: none;
    }

    #leftFlash {
      left: 0;
      background: linear-gradient(to right, rgba(255, 60, 60, 0.85), rgba(255, 60, 60, 0));
    }

    #rightFlash {
      right: 0;
      background: linear-gradient(to left, rgba(255, 60, 60, 0.85), rgba(255, 60, 60, 0));
    }

    #leftFlash.passive,
    #rightFlash.passive {
      animation: none;
      width: 80px;
      opacity: 0.75;
    }

    #leftFlash.passive {
      background: linear-gradient(to right, rgba(245, 185, 66, 1.0), rgba(245, 185, 66, 0));
    }

    #rightFlash.passive {
      background: linear-gradient(to left, rgba(245, 185, 66, 1.0), rgba(245, 185, 66, 0));
    }

    [data-theme="light"] #leftFlash {
      background: linear-gradient(to right, rgba(211, 42, 42, 0.85), rgba(211, 42, 42, 0));
    }

    [data-theme="light"] #rightFlash {
      background: linear-gradient(to left, rgba(211, 42, 42, 0.85), rgba(211, 42, 42, 0));
    }

    [data-theme="light"] #leftFlash.passive {
      background: linear-gradient(to right, rgba(178, 116, 0, 1.0), rgba(178, 116, 0, 0));
    }

    [data-theme="light"] #rightFlash.passive {
      background: linear-gradient(to left, rgba(178, 116, 0, 1.0), rgba(178, 116, 0, 0));
    }

    @keyframes flashPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #leftBlink, #rightBlink {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 200px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease-out;
    }

    #leftBlink {
      left: 0;
      background: linear-gradient(to right, rgba(0, 208, 82, 0.80), rgba(0, 208, 82, 0));
    }

    #rightBlink {
      right: 0;
      background: linear-gradient(to left, rgba(0, 208, 82, 0.80), rgba(0, 208, 82, 0));
    }

    [data-theme="light"] #leftBlink {
      background: linear-gradient(to right, rgba(0, 152, 56, 0.80), rgba(0, 152, 56, 0));
    }

    [data-theme="light"] #rightBlink {
      background: linear-gradient(to left, rgba(0, 152, 56, 0.80), rgba(0, 152, 56, 0));
    }

    #units {
      grid-column: 3;
      font-size: 24px;
      line-height: 1;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
      user-select: none;
      text-align: right;
    }

    #speedLimit {
      display: none;
      align-items: baseline;
      gap: 10px;
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
    }

    #speedLimitLabel {
      font-size: 20px;
      line-height: 1;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }

    #speedLimitValue {
      font-size: 62px;
      line-height: 1;
      color: var(--fg);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      transition: color 0.4s ease;
    }

    #speedLimitLabel {
      transition: color 0.4s ease;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="breathLayer"></div>
    <div id="ambientLayer"></div>
    <div id="leftFlash"></div>
    <div id="rightFlash"></div>

    <div id="leftBlink"></div>
    <div id="rightBlink"></div>

    <div id="topRow">
      <div id="gearChip"></div>
      <div id="warningChips"></div>
    </div>

    <div id="speedLayer">
      <div id="speedWrap">
        <div id="speed">0</div>
        <div id="setSpeedWrap">
          <div id="setSpeed">0</div>
        </div>
      </div>
    </div>

    <div id="bottomRow">
      <div id="speedLimit">
        <span id="speedLimitLabel">Limit</span>
        <span id="speedLimitValue">0</span>
      </div>

      <div id="assistLabel">
        <span id="assistDot"></span>
        <span id="assistText"></span>
      </div>

      <div id="units">mph</div>
    </div>
    <div id="edgeAccent"></div>
  </div>

  <script>
    const ASSIST_META = {
      dark: {
        off: {
          short: "OFF",
          long: "Manual",
          accent: "#d8c39a",
          tint: "rgba(216, 195, 154, 0.28)",
          dimGlow24: "rgba(216, 195, 154, 0.30)",
          dimGlow48: "rgba(216, 195, 154, 0.20)",
        },
        mads: {
          short: "MADS",
          long: "Lane Assist",
          accent: "#00C8C8",
          tint: "rgba(0, 200, 200, 0.28)",
          dimGlow24: "rgba(0, 200, 200, 0.30)",
          dimGlow48: "rgba(0, 200, 200, 0.20)",
        },
        full: {
          short: "AUTO",
          long: "Full Assist",
          accent: "#60F594",
          tint: "rgba(96, 245, 148, 0.28)",
          dimGlow24: "rgba(96, 245, 148, 0.30)",
          dimGlow48: "rgba(96, 245, 148, 0.20)",
        },
      },
      light: {
        off: {
          short: "OFF",
          long: "Manual",
          accent: "#7d6029",
          tint: "rgba(125, 96, 41, 0.20)",
          dimGlow24: "rgba(125, 96, 41, 0.15)",
          dimGlow48: "rgba(125, 96, 41, 0.10)",
        },
        mads: {
          short: "MADS",
          long: "Lane Assist",
          accent: "#007078",
          tint: "rgba(0, 112, 120, 0.20)",
          dimGlow24: "rgba(0, 112, 120, 0.15)",
          dimGlow48: "rgba(0, 112, 120, 0.10)",
        },
        full: {
          short: "AUTO",
          long: "Full Assist",
          accent: "#007a3c",
          tint: "rgba(0, 122, 60, 0.20)",
          dimGlow24: "rgba(0, 122, 60, 0.15)",
          dimGlow48: "rgba(0, 122, 60, 0.10)",
        },
      },
    };

    const THEME_STYLES = {
      dark: {
        knockout: "0 0 3px rgba(10, 11, 13, 0.97), 0 0 8px rgba(10, 11, 13, 0.92), 0 0 12px rgba(10, 11, 13, 0.5)",
        knockoutSmall: "0 0 1px rgba(10, 11, 13, 0.98), 0 0 4px rgba(10, 11, 13, 0.94), 0 0 8px rgba(10, 11, 13, 0.72)",
        speedHighlight: "0 -1px 0 rgba(241, 239, 233, 0.15)",
        fgRGB: [241, 239, 233],
        redRGB: [255, 117, 117],
        overGlowRGB: "255,60,60",
        gearBg: "#1a1a17",
        gearFg: "#f1efe9",
        gearRevBg: "#b22a2a",
        gearRevFg: "#f1efe9",
      },
      light: {
        knockout: "0 0 3px rgba(236, 233, 226, 0.97), 0 0 8px rgba(236, 233, 226, 0.92), 0 0 12px rgba(236, 233, 226, 0.5)",
        knockoutSmall: "0 0 1px rgba(236, 233, 226, 0.98), 0 0 4px rgba(236, 233, 226, 0.94), 0 0 8px rgba(236, 233, 226, 0.72)",
        speedHighlight: "0 1px 0 rgba(22, 24, 28, 0.10)",
        fgRGB: [22, 24, 28],
        redRGB: [179, 36, 36],
        overGlowRGB: "211,42,42",
        gearBg: "#e0dcd2",
        gearFg: "#16181c",
        gearRevBg: "#b22a2a",
        gearRevFg: "#f6f4ee",
      },
    };

    function activeThemeKey() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    const gearMap = { 1: "P", 2: "R", 3: "N", 4: "D" };

    const app = document.getElementById("app");
    const edgeAccent = document.getElementById("edgeAccent");
    const speedEl = document.getElementById("speed");
    const setSpeedWrap = document.getElementById("setSpeedWrap");
    const setSpeedEl = document.getElementById("setSpeed");
    const assistLabel = document.getElementById("assistLabel");
    const assistText = document.getElementById("assistText");
    const gearChip = document.getElementById("gearChip");
    const warningChips = document.getElementById("warningChips");
    const leftFlash = document.getElementById("leftFlash");
    const rightFlash = document.getElementById("rightFlash");
    const leftBlink = document.getElementById("leftBlink");
    const rightBlink = document.getElementById("rightBlink");
    const speedLimit = document.getElementById("speedLimit");
    const speedLimitValue = document.getElementById("speedLimitValue");
    const speedLimitLabel = document.getElementById("speedLimitLabel");
    const unitsEl = document.getElementById("units");
    const bottomRow = document.getElementById("bottomRow");
    const breathLayer = document.getElementById("breathLayer");
    const ambientLayer = document.getElementById("ambientLayer");

    function mapAssist(car) {
      if (car.adasOn) return "full";
      if (car.madsActive) return "mads";
      return "off";
    }

    function mapLaneDeparture(value) {
      const ldw = Number(value) || 0;
      if (ldw === 1 || ldw === 3) return "left";
      if (ldw === 2 || ldw === 4) return "right";
      return null;
    }

    function setBlinker(el, state) {
      const s = Number(state) || 0;
      if (s === 2) el.style.opacity = "1";
      else if (s === 1) el.style.opacity = "0.25";
      else el.style.opacity = "0";
    }

    function drawWarningChips(car) {
      const gear = gearMap[Math.round(Number(car.gear) || 0)] || "-";
      const isParked = gear === "P";
      const isDrive = gear === "D";
      const chips = [];
      if ((Number(car.anyDoorOpen) || 0) > 0) chips.push({ text: "Door open", tone: "red" });
      if (!isParked && (Number(car.buckleStatus) || 0) === 0) chips.push({ text: "Buckle up", tone: "red" });
      if (isDrive && (Number(car.speedCameraDistance) || 0) > 0) chips.push({ text: "Speed camera " + Math.round(car.speedCameraDistance) + "m", tone: "amber" });

      warningChips.innerHTML = "";
      for (const chip of chips) {
        const el = document.createElement("div");
        el.className = "chip " + (chip.tone === "red" ? "chip-red" : "chip-amber");
        el.textContent = chip.text;
        warningChips.appendChild(el);
      }
    }

    function lerpColor(a, b, t) {
      return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
    }

    function applySpeedStyle({ speed, theme }) {
      speedEl.textContent = String(speed);
      speedEl.style.color = "var(--fg)";
      speedEl.style.textShadow = theme.knockout + ", " + theme.speedHighlight;
    }

    function applySpeedLimitStyle({ overT, speedLimitValueNum, theme }) {
      if (speedLimitValueNum > 0) {
        speedLimit.style.display = "flex";
        speedLimitValue.textContent = String(speedLimitValueNum);
        if (overT > 0) {
          speedLimitValue.style.color = lerpColor(theme.fgRGB, theme.redRGB, overT);
          speedLimitLabel.style.color = lerpColor(theme.fgRGB, theme.redRGB, overT);
          speedLimitValue.style.textShadow =
            theme.knockout + `, 0 0 28px rgba(${theme.overGlowRGB},${(0.7 * overT).toFixed(2)}), 0 0 64px rgba(${theme.overGlowRGB},${(0.4 * overT).toFixed(2)})`;
          speedLimitLabel.style.textShadow =
            theme.knockoutSmall + `, 0 0 16px rgba(${theme.overGlowRGB},${(0.7 * overT).toFixed(2)}), 0 0 32px rgba(${theme.overGlowRGB},${(0.35 * overT).toFixed(2)})`;
        } else {
          speedLimitValue.style.color = "var(--fg)";
          speedLimitLabel.style.color = "var(--muted)";
          speedLimitValue.style.textShadow = "";
          speedLimitLabel.style.textShadow = "";
        }
      } else {
        speedLimit.style.display = "none";
      }
    }

    function receiveMessage(car) {
      lastCar = car;
      // iOS sends darkMode in the message payload; Android sets data-theme via onCarStateUpdate.
      // Only write on change: the MutationObserver below fires on every setAttribute call.
      if (typeof car.darkMode === "boolean") {
        const nextTheme = car.darkMode ? "dark" : "light";
        if (document.documentElement.getAttribute("data-theme") !== nextTheme) {
          document.documentElement.setAttribute("data-theme", nextTheme);
        }
      }
      const themeKey = activeThemeKey();
      const theme = THEME_STYLES[themeKey];
      const speed = Math.max(0, Math.round(Number(car.egoSpeed) || 0));
      const setSpeed = Math.max(0, Math.round(Number(car.accSetSpeed) || 0));
      const speedLimitValueNum = Math.max(0, Math.round(Number(car.fusedSpeedLimit) || 0));
      const assist = mapAssist(car);
      const assistMeta = ASSIST_META[themeKey][assist];
      const isAssistOn = assist !== "off";
      const accent = assistMeta.accent;

      document.documentElement.style.setProperty("--accent", accent);

      breathLayer.style.background =
        "radial-gradient(ellipse at 50% 78%, " + assistMeta.tint + " 0%, transparent 100%)";
      ambientLayer.style.background =
        "radial-gradient(ellipse at 50% 78%, " + assistMeta.tint + " 0%, transparent 100%)";

      const gear = gearMap[Math.round(Number(car.gear) || 0)] || "-";
      const isDrive = gear === "D";
      const pctOver = isDrive && speedLimitValueNum > 0 ? (speed - speedLimitValueNum) / speedLimitValueNum : 0;
      const overT = Math.min(1, Math.max(0, (pctOver - 0.15) / 0.10));
      applySpeedStyle({ speed, theme });

      const showSetSpeed = assist === "full" && setSpeed > 0;
      setSpeedWrap.style.display = showSetSpeed ? "flex" : "none";
      if (showSetSpeed) {
        setSpeedEl.textContent = String(setSpeed);
        setSpeedEl.style.textShadow =
          theme.knockout + ", 0 0 18px " + assistMeta.dimGlow24 + ", 0 0 36px " + assistMeta.dimGlow48;
      }

      assistLabel.style.display = isAssistOn ? "flex" : "none";
      assistText.textContent = assistMeta.long;

      if (isDrive) {
        gearChip.style.display = "none";
      } else {
        gearChip.style.display = "block";
        gearChip.textContent = gear;
        gearChip.style.background = gear === "R" ? theme.gearRevBg : theme.gearBg;
        gearChip.style.color = gear === "R" ? theme.gearRevFg : theme.gearFg;
      }

      drawWarningChips(car);

      const laneDeparture = mapLaneDeparture(car.laneDepartureWarning);
      const leftBlind = (Number(car.leftBlindSpot) || 0) > 0;
      const rightBlind = (Number(car.rightBlindSpot) || 0) > 0;
      const leftBlinkerOn = (Number(car.leftBlinker) || 0) > 0;
      const rightBlinkerOn = (Number(car.rightBlinker) || 0) > 0;
      const leftLaneDep = laneDeparture === "left";
      const rightLaneDep = laneDeparture === "right";

      const leftUrgent = (leftBlind && leftBlinkerOn) || leftLaneDep;
      const rightUrgent = (rightBlind && rightBlinkerOn) || rightLaneDep;
      const leftPassive = leftBlind && !leftBlinkerOn && !leftLaneDep;
      const rightPassive = rightBlind && !rightBlinkerOn && !rightLaneDep;

      const leftActive = leftUrgent || leftPassive;
      const rightActive = rightUrgent || rightPassive;

      leftFlash.classList.toggle("urgent", leftUrgent);
      leftFlash.classList.toggle("passive", leftPassive);
      rightFlash.classList.toggle("urgent", rightUrgent);
      rightFlash.classList.toggle("passive", rightPassive);

      setBlinker(leftBlink, leftActive ? 0 : car.leftBlinker);
      setBlinker(rightBlink, rightActive ? 0 : car.rightBlinker);

      applySpeedLimitStyle({ overT, speedLimitValueNum, theme });

      unitsEl.textContent = car.isImperial ? "mph" : "km/h";
      const edgeGradient =
        "linear-gradient(to right, transparent 0%, " +
        accent + " 50%, transparent 100%)";
      edgeAccent.style.background = edgeGradient;
      bottomRow.style.textShadow = theme.knockoutSmall;
    }

    let lastCar = null;

    window.receiveMessage = receiveMessage;

    new MutationObserver(() => {
      if (lastCar) receiveMessage(lastCar);
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    function readNative(method, fallback) {
      try {
        if (!window.NativeCarState) return fallback;
        const fn = window.NativeCarState[method];
        if (typeof fn !== "function") return fallback;
        return fn.call(window.NativeCarState);
      } catch (_err) {
        return fallback;
      }
    }

    window.onCarStateUpdate = function() {
      const isDarkMode = readNative("isDarkMode", true);
      document.documentElement.setAttribute("data-theme", isDarkMode ? "dark" : "light");
      const car = {
        egoSpeed: readNative("getEgoSpeed", 0),
        leftBlinker: readNative("getLeftBlinker", 0),
        rightBlinker: readNative("getRightBlinker", 0),
        gear: readNative("getGear", 0),
        adasOn: readNative("isAdasOn", false),
        madsActive: readNative("isMadsActive", false),
        leftBlindSpot: readNative("getLeftBlindSpot", 0),
        rightBlindSpot: readNative("getRightBlindSpot", 0),
        laneDepartureWarning: readNative("getLaneDepartureWarning", 0),
        anyDoorOpen: readNative("getAnyDoorOpen", 0),
        buckleStatus: readNative("getBuckleStatus", 1),
        accSetSpeed: readNative("getAccSetSpeed", 0),
        fusedSpeedLimit: readNative("getFusedSpeedLimit", 0),
        speedCameraDistance: readNative("getSpeedCameraDistance", -1),
        isImperial: readNative("isImperial", false),
      };
      receiveMessage(car);
    };

    receiveMessage({
      egoSpeed: 0,
      leftBlinker: 0,
      rightBlinker: 0,
      gear: 4,
      adasOn: false,
      madsActive: false,
      leftBlindSpot: 0,
      rightBlindSpot: 0,
      laneDepartureWarning: 0,
      anyDoorOpen: 0,
      buckleStatus: 1,
      accSetSpeed: 0,
      fusedSpeedLimit: 0,
      speedCameraDistance: -1,
      isImperial: true,
    });
  </script>
</body>
</html>
